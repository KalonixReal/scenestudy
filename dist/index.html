<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try { const theme = localStorage.getItem('scenestudy-theme'); document.documentElement.dataset.theme = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }</script>
    <meta name="description" content="Study the key scenes in Hidden Figures with authored scene cards, film analysis practice, and a personal progress history." />
    <meta name="theme-color" content="#fcfcf9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SceneStudy" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23efd46b'/%3E%3Cpath d='m8 16 12-6 12 6-12 6Zm0 6 12 6 12-6m-24 6 12 6 12-6' fill='none' stroke='%2330352c' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Hidden Figures | SceneStudy</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip To Content</a>
    <div class="app-shell">
      <header class="mobile-topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open Navigation Menu" aria-expanded="false" aria-controls="sidebar"></button>
        <button type="button" class="topbar-theme" data-action="theme" aria-label="Switch Color Theme"></button>
        <span class="mobile-brand"><span class="brand-mark" id="mobileBrandMark"></span>scene<span class="brand-dot">·</span><span class="brand-study">study</span></span>
        <button type="button" class="topbar-due" id="topbarDue" data-action="studyDue" aria-label="Reviews Due" hidden></button>
      </header>

      <aside class="sidebar" id="sidebar" aria-label="Study Navigation">
        <div class="sidebar-brand">
          <span class="brand">
            <span class="brand-mark" id="brandMark"></span>
            <span>scene<span class="brand-dot">·</span><span class="brand-study">study</span></span>
          </span>
          <button type="button" class="icon-button mobile-nav-close" id="navClose" aria-label="Close Navigation Menu">✕</button>
        </div>
        <p class="workspace-label"><span class="workspace-dot"></span><span id="workspaceName">Hidden Figures</span></p>
        <nav class="study-nav" id="studyNav" aria-label="Study Modes"></nav>
        <div class="sidebar-foot">
          <button type="button" class="kbd-help-btn" id="kbdHelpBtn" data-action="shortcuts" aria-label="Keyboard Shortcuts" title="Keyboard Shortcuts (Press ?)"></button>
          <button type="button" class="theme-toggle" data-action="theme" aria-label="Switch Color Theme"></button>
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

      <main class="main-area" id="main">
        <div class="view-wrap" id="view" tabindex="-1"></div>
        <footer class="app-footer">
          <span class="foot-brand"><span class="brand-mark" style="width:24px;height:24px;border-radius:7px" id="footMark"></span>SceneStudy</span>
          <span id="footNote">Build recall. Make connections. Write with evidence.</span>
        </footer>
      </main>
    </div>

    <div id="modalRoot"></div>
    <input type="file" id="progressFile" accept=".json,application/json" aria-label="Restore Progress Backup File" hidden/>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf" aria-label="Add Scenes From PDF File" hidden/>
    <div class="toast-root" id="toastRoot" role="status" aria-live="polite"></div>
    
    <script src="./data/scenes.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
