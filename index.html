<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try { if (localStorage.getItem('scenestudy-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
    <meta name="theme-color" content="#fcfcf9" />
    <meta name="description" content="Remember every important scene with flashcards, matching, quizzes, and recall practice. Bring your own film by uploading a custom scene sheet. Private, offline-ready study space." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SceneStudy" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23efd46b'/%3E%3Cpath d='m8 16 12-6 12 6-12 6Zm0 6 12 6 12-6m-24 6 12 6 12-6' fill='none' stroke='%2330352c' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Hidden Figures | SceneStudy</title>
    <style>
      /* ============ DESIGN TOKENS ============ */
      :root {
        --ink: #30352c;
        --ink-soft: #4a4f42;
        --muted: #6e7463;
        --line: #e3e7d8;
        --line-strong: #d5dac7;
        --yellow: #efd46b;
        --yellow-deep: #e8bd34;
        --yellow-soft: #f7e9b1;
        --paper: #fcfcf9;
        --card: #ffffff;
        --sage: #a5b38e;
        --sage-soft: #eef1e4;
        --danger: #b3402e;
        --danger-soft: #f9e9e4;
        --ok: #4e7a3f;
        --ok-soft: #eaf2e2;
        --lav: #8d7fb0;
        --lav-soft: #ede9f4;
        --display: "Space Grotesk", "DM Sans", "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        --body: "DM Sans", "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --radius: 14px;
        --radius-sm: 9px;
        --shadow: 0 1px 2px rgba(48, 53, 44, 0.05), 0 8px 28px -12px rgba(48, 53, 44, 0.18);
        --shadow-lift: 0 2px 4px rgba(48, 53, 44, 0.06), 0 16px 40px -14px rgba(48, 53, 44, 0.26);
        --sidebar-w: 262px;
        --soft: #f1f3e8;
        --footer-bg: #fafbf5;
        --sidebar-bg: #f6f7f1;
        --topbar-bg: rgba(252, 252, 249, 0.92);
        --danger-line: #e5c4bb;
        --yellow-hover: #f3dd8d;
        --yellow-ink-deep: #6d5a14;
        --yellow-line: #ecd98a;
        --hero-grad: linear-gradient(135deg, #fdfcf4 0%, #f7f3dd 58%, #f3ead0 100%);
        --hero-border: #ece4c2;
        --hero-chip-bg: rgba(255, 255, 255, 0.75);
        --hero-chip-line: #e8dfb5;
        --hero-chip-text: #6d6428;
        --dot: rgba(48, 53, 44, 0.055);
        color-scheme: light;
      }

      /* ============ BASE — BIGGER, FRIENDLIER TYPE ============ */
      * { box-sizing: border-box; }
      html { font-size: 17px; }
      @media (min-width: 1000px) { html { font-size: 18px; } }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        line-height: 1.6;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; transition: background 0.17s, border-color 0.17s, color 0.17s, transform 0.17s, box-shadow 0.17s; }
      button:disabled { cursor: default; }
      a { color: inherit; text-decoration: none; }
      svg { flex-shrink: 0; }
      h1, h2, h3, p { margin: 0; }
      h1, h2, h3 { font-family: var(--display); line-height: 1.22; letter-spacing: -0.015em; }
      ::selection { color: #30352c; background: #f1d982; }
      kbd { color: var(--ink-soft); }

      :focus-visible { outline: 2px solid #a2892c; outline-offset: 3px; border-radius: 4px; }

      /* Custom scrollbars */
      * { scrollbar-width: thin; scrollbar-color: #c9cfba transparent; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb { background: #cdd3bf; border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
      *::-webkit-scrollbar-thumb:hover { background: #b4bca4; border: 3px solid transparent; background-clip: content-box; }

      .sr-only {
        clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; width: 1px; height: 1px;
        margin: -1px; padding: 0; position: absolute; overflow: hidden;
      }
      .mono { font-family: var(--mono); }

      .skip-link {
        z-index: 300; background: var(--yellow); color: var(--ink); font-weight: 650;
        border-radius: 8px; padding: 12px 22px; position: fixed; top: -70px; left: 16px;
        transition: top 0.2s;
      }
      .skip-link:focus { top: 12px; }

      /* ============ APP SHELL ============ */
      .app-shell { min-height: 100vh; }

      .mobile-topbar {
        display: none; position: sticky; top: 0; z-index: 60;
        background: var(--topbar-bg); backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        align-items: center; justify-content: space-between; gap: 12px;
        padding: 10px 16px;
      }
      .menu-btn {
        display: grid; place-items: center; width: 44px; height: 44px;
        background: transparent; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--ink);
      }
      .menu-btn:hover { background: var(--sage-soft); }
      .mobile-brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em; }
      .topbar-due {
        display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 650;
        background: var(--yellow-soft); border: 1px solid var(--yellow-line); color: var(--yellow-ink-deep);
        padding: 6px 11px; border-radius: 999px; cursor: pointer;
      }
      .topbar-due:hover { background: var(--yellow-hover); }
      #view:focus { outline: none; }

      .sidebar {
        z-index: 90; background: var(--sidebar-bg); border-right: 1px solid var(--line);
        flex-direction: column; width: var(--sidebar-w); padding: 26px 16px 18px;
        display: flex; position: fixed; top: 0; bottom: 0; left: 0; overflow-y: auto;
      }
      .sidebar-brand { justify-content: space-between; align-items: center; margin-bottom: 34px; padding: 0 8px; display: flex; }
      .brand {
        font-family: var(--display); letter-spacing: -0.03em; white-space: nowrap;
        align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 700; display: flex;
      }
      .brand-mark { background: var(--yellow); border-radius: 11px; place-items: center; width: 40px; height: 40px; display: grid; box-shadow: inset 0 -2px 0 rgba(48,53,44,0.08); }
      .brand-study { font-weight: 450; color: var(--muted); }
      .brand-dot { color: #c5a130; }

      .workspace-label {
        color: #929986; letter-spacing: 0.16em; align-items: center; gap: 8px;
        margin-bottom: 14px; padding: 0 13px; font-size: 0.66rem; font-weight: 700;
        display: flex; text-transform: uppercase;
      }
      .workspace-dot { background: var(--sage); border-radius: 100%; width: 6px; height: 6px; }

      .study-nav { flex-direction: column; gap: 4px; display: flex; }
      .nav-item {
        text-align: left; color: #6d7564; background: 0 0; border: 0; border-radius: 10px;
        align-items: center; gap: 13px; width: 100%; min-height: 48px; padding: 10px 13px;
        font-size: 0.94rem; font-weight: 500; display: flex; position: relative;
      }
      .nav-item:hover { color: var(--ink); background: #ecefe4; }
      .nav-item.active { color: #393a26; background: var(--yellow); font-weight: 700; box-shadow: inset 0 -2px 0 rgba(48,53,44,0.06); }
      .nav-count {
        text-align: center; min-width: 22px; height: 22px; padding: 0 7px;
        border-radius: 999px; background: #dde2d0; color: #5c6350;
        font-size: 0.72rem; font-weight: 700; line-height: 22px; margin-left: auto;
        font-family: var(--mono);
      }
      .nav-item.active .nav-count { background: rgba(255, 255, 255, 0.55); color: #4c4a1e; }
      .nav-due-badge {
        position: absolute; top: 7px; right: 9px; width: 10px; height: 10px; border-radius: 50%;
        background: var(--danger); border: 2px solid var(--sidebar-bg);
      }
      .nav-item.active .nav-due-badge { border-color: var(--yellow); }

      .sidebar-foot { margin-top: auto; padding: 18px 10px 4px; display: flex; flex-direction: column; gap: 10px; }
      .offline-chip {
        display: flex; align-items: center; gap: 9px; font-size: 0.8rem; color: var(--muted);
        background: #fdfef9; border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px;
      }
      .offline-chip b { color: var(--ink-soft); font-weight: 650; }
      .sidebar-version { font-size: 0.72rem; color: #828876; padding: 0 4px; }

      .sidebar-overlay {
        display: none; position: fixed; inset: 0; z-index: 80;
        background: rgba(48, 53, 44, 0.4); backdrop-filter: blur(2px);
      }
      body.nav-open .sidebar-overlay { display: block; }

      .main-area {
        margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column;
      }
      .view-wrap { flex: 1 0 auto; width: 100%; max-width: 1180px; margin: 0 auto; padding: 34px 36px 46px; }

      .app-footer {
        flex-shrink: 0; margin-top: auto; border-top: 1px solid var(--line);
        padding: 18px 36px calc(18px + env(safe-area-inset-bottom, 0px));
        display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; justify-content: space-between;
        color: #828876; font-size: 0.8rem; background: var(--footer-bg);
      }
      .app-footer .foot-brand { display: flex; align-items: center; gap: 7px; font-family: var(--display); font-weight: 700; color: #8d937f; }

      @media (max-width: 900px) {
        .mobile-topbar { display: flex; }
        .sidebar {
          transform: translateX(-104%); transition: transform 0.24s ease; width: min(86vw, 300px);
          box-shadow: var(--shadow-lift);
        }
        body.nav-open .sidebar { transform: translateX(0); }
        .main-area { margin-left: 0; }
        .view-wrap { padding: 22px 16px 34px; }
        .app-footer { padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
      }

      /* ============ SHARED UI ============ */
      .eyebrow {
        display: inline-block; color: #8a7420; letter-spacing: 0.18em; text-transform: uppercase;
        font-size: 0.72rem; font-weight: 800; margin-bottom: 8px;
      }
      .quiet-tag {
        align-self: center; color: #8d937f; background: #f2f4ea; border: 1px solid var(--line);
        border-radius: 999px; padding: 7px 14px; font-size: 0.76rem; font-weight: 700;
        letter-spacing: 0.09em; text-transform: uppercase; white-space: nowrap;
      }

      .section-toolbar {
        display: flex; gap: 16px; align-items: flex-start; justify-content: space-between;
        margin-bottom: 20px; flex-wrap: wrap;
      }
      .section-toolbar h2 { font-size: 1.55rem; }
      .section-toolbar .section-sub { color: var(--muted); margin-top: 3px; font-size: 0.98rem; }
      .toolbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

      .button {
        display: inline-flex; align-items: center; justify-content: center; gap: 9px;
        border-radius: 11px; border: 1px solid transparent; font-weight: 650; font-size: 0.95rem;
        padding: 12px 20px; min-height: 47px; line-height: 1.2;
      }
      .button.primary { background: var(--ink); color: #fdfdf6; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25); }
      .button.primary:hover:not(:disabled) { background: #454b3d; }
      .button.yellow { background: var(--yellow); color: #3c3510; box-shadow: inset 0 -2px 0 rgba(48,53,44,0.1); }
      .button.yellow:hover:not(:disabled) { background: #f3dc7e; }
      .button.secondary { background: var(--card); border-color: var(--line-strong); color: var(--ink-soft); }
      .button.secondary:hover:not(:disabled) { border-color: #b9c1a6; background: #fbfcf6; }
      .button.danger-button { background: var(--card); border-color: var(--danger-line); color: var(--danger); }
      .button.danger-button:hover:not(:disabled) { background: var(--danger-soft); }
      .button:disabled { opacity: 0.45; }
      .button.small-button { min-height: 40px; padding: 8px 14px; font-size: 0.86rem; border-radius: 9px; }
      .text-button {
        display: inline-flex; align-items: center; gap: 7px; background: none; border: 0;
        color: var(--ink-soft); font-weight: 650; font-size: 0.9rem; padding: 9px 11px; border-radius: 8px;
        min-height: 44px;
      }
      .text-button:hover { background: var(--soft); color: var(--ink); }

      .select-wrap { position: relative; display: inline-flex; align-items: center; }
      .select-wrap select {
        appearance: none; -webkit-appearance: none; background: var(--card); border: 1px solid var(--line-strong);
        border-radius: 10px; padding: 11px 40px 11px 14px; font-weight: 600; font-size: 0.92rem;
        color: var(--ink-soft); min-height: 47px; max-width: 100%; cursor: pointer;
      }
      .select-wrap select:hover { border-color: #b9c1a6; }
      .select-wrap svg { position: absolute; right: 13px; pointer-events: none; color: var(--muted); }

      input[type="text"], input[type="search"], textarea {
        background: var(--card); border: 1px solid var(--line-strong); border-radius: 11px;
        padding: 12px 15px; font-size: 1rem; color: var(--ink); width: 100%;
      }
      input[type="text"]:focus, input[type="search"]:focus, textarea:focus, .select-wrap select:focus {
        outline: 2px solid #a2892c; outline-offset: 1px; border-color: #cdb557;
      }
      textarea { resize: vertical; line-height: 1.6; }
      label { font-size: 0.88rem; font-weight: 700; color: var(--ink-soft); }

      .activity-instructions {
        display: flex; align-items: center; gap: 12px; background: var(--sage-soft);
        border: 1px solid #dfe5cf; border-radius: 12px; padding: 13px 17px; margin-bottom: 18px;
        color: #55604a; font-size: 0.95rem;
      }
      .activity-instructions p { flex: 1; }
      .activity-instructions span { font-weight: 800; font-family: var(--mono); font-size: 0.85rem; color: #43503a; white-space: nowrap; }

      .match-progress { height: 9px; background: #edf0e2; border-radius: 999px; overflow: hidden; margin-bottom: 22px; border: 1px solid #e4e8d5; }
      .match-progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--yellow), var(--yellow-deep)); border-radius: 999px; transition: width 0.35s ease; }

      .technique-footer {
        display: flex; gap: 14px; margin-top: 26px; background: #fbfcf5; border: 1px solid var(--line);
        border-radius: 13px; padding: 16px 18px; color: var(--muted); font-size: 0.92rem;
      }
      .technique-footer svg { color: #c5a130; margin-top: 2px; }
      .technique-footer strong { color: var(--ink); display: block; margin-bottom: 2px; font-size: 0.95rem; }
      .technique-footer p { line-height: 1.55; }

      .empty-note {
        text-align: center; color: var(--muted); background: #fbfcf5; border: 1.5px dashed var(--line-strong);
        border-radius: 14px; padding: 34px 22px; font-size: 1rem;
      }

      /* ============ OVERVIEW ============ */
      .hero { position: relative; overflow: hidden; background: var(--hero-grad); border: 1px solid var(--hero-border); border-radius: 20px; padding: 34px 36px 30px; margin-bottom: 30px; }
      .hero::after {
        content: ""; position: absolute; right: -70px; top: -70px; width: 260px; height: 260px; border-radius: 50%;
        background: radial-gradient(circle, rgba(239, 212, 107, 0.5), rgba(239, 212, 107, 0) 68%);
      }
      .hero h1 { font-size: clamp(1.75rem, 3.4vw, 2.5rem); letter-spacing: -0.025em; max-width: 21ch; }
      .hero .hero-sub { color: var(--ink-soft); margin-top: 10px; max-width: 58ch; font-size: 1.05rem; line-height: 1.65; }
      .hero-actions { display: flex; gap: 11px; margin-top: 22px; flex-wrap: wrap; }
      .hero-chip {
        display: inline-flex; align-items: center; gap: 8px; background: var(--hero-chip-bg);
        border: 1px solid var(--hero-chip-line); border-radius: 999px; padding: 7px 14px; font-size: 0.82rem; font-weight: 700; color: var(--hero-chip-text);
        margin-bottom: 16px;
      }

      .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 13px; margin-bottom: 32px; }
      .stat-tile { background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 17px 18px; box-shadow: var(--shadow); }
      .stat-tile .stat-num { font-family: var(--display); font-size: 1.9rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
      .stat-tile .stat-label { color: var(--muted); font-size: 0.83rem; font-weight: 600; margin-top: 3px; }
      .stat-tile.accent { background: linear-gradient(150deg, #fffdf2, #fdf4cd); border-color: #eedd9a; }
      .stat-tile.accent .stat-num { color: #6d5a14; }

      .strategy-heading { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
      .strategy-heading h2 { font-size: 1.45rem; }
      .strategy-heading span { color: var(--muted); font-size: 0.95rem; }
      .strategy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; }
      .strategy-card {
        text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
        padding: 19px 20px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow);
        transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      }
      .strategy-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: #d8ddb4; }
      .strategy-card .sc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .strategy-card h3 { font-size: 1.06rem; }
      .strategy-card p { color: var(--muted); font-size: 0.92rem; line-height: 1.55; flex: 1; }
      .strategy-card .sc-action { display: inline-flex; align-items: center; gap: 6px; color: #8a6d1d; font-weight: 700; font-size: 0.86rem; }
      .activity-icon { border-radius: 10px; display: grid; place-items: center; width: 38px; height: 38px; }
      .activity-icon.yellow { background: var(--yellow-soft); color: #8a6d1d; }
      .activity-icon.sage { background: var(--sage-soft); color: #5c6b47; }
      .activity-icon.lavender { background: var(--lav-soft); color: var(--lav); }

      /* ============ FLASHCARDS ============ */
      .study-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
      @media (max-width: 1080px) { .study-layout { grid-template-columns: 1fr; } }

      .flashcard-zone { position: relative; }
      .flashcard {
        position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
        min-height: 430px; padding: 30px 32px; display: flex; flex-direction: column;
        box-shadow: var(--shadow); transform-origin: center;
      }
      .flashcard.flipping { animation: cardpulse 0.3s ease; }
      @keyframes cardpulse { 0% { transform: scale(0.985); } 100% { transform: scale(1); } }
      .flashcard .fc-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
      .fc-scene-tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-weight: 700; font-size: 0.82rem; color: #8a6d1d; background: var(--yellow-soft); border-radius: 8px; padding: 5px 10px; }
      .fc-actions { display: flex; gap: 4px; }
      .icon-button {
        display: grid; place-items: center; width: 42px; height: 42px; border-radius: 10px;
        border: 1px solid transparent; background: transparent; color: var(--muted);
      }
      .icon-button:hover { background: #f3f5ea; color: var(--ink); }
      .icon-button.saved { color: #8a6d1d; background: var(--yellow-soft); }
      .fc-art { align-self: center; color: #6f7562; margin: 4px 0 10px; }
      .fc-art svg { width: min(300px, 60vw); height: auto; }
      .fc-title { font-size: 1.5rem; text-align: center; letter-spacing: -0.02em; }
      .fc-hint { text-align: center; color: var(--muted); margin-top: 8px; font-size: 0.95rem; }

      .fc-back-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 13px; margin-top: 6px; }
      .fc-block { background: #fbfcf5; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
      .fc-block h4 { margin: 0 0 6px; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7420; font-family: var(--body); }
      .fc-block p { font-size: 0.95rem; line-height: 1.6; color: var(--ink-soft); }
      .fc-fulltitle { font-size: 1.18rem; margin-bottom: 4px; }
      .fc-desc { color: var(--ink-soft); line-height: 1.65; font-size: 1rem; }
      .theme-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
      .tag-chip { display:inline-flex; align-items:center; gap:5px; border:1px dashed #b3bb9f; color:#5d6352; background:transparent; border-radius:999px; padding:3px 10px; font-size:0.76rem; font-weight:600; letter-spacing:0.01em; }
      .tile-tags { color:#757b69; font-size:0.76rem; font-weight:600; font-family:var(--mono); margin-top:2px; }
      .quiz-tagrow { margin-bottom:10px; }
      .quiz-setup { display:grid; grid-template-columns: 1.6fr 1fr; gap:18px; align-items:start; }
      .setup-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; }
      .setup-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
      .setup-item { display:flex; gap:10px; align-items:flex-start; }
      .setup-icn { flex:none; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:#f4f6ec; color:#5d6352; border:1px solid var(--line); }

      /* ============ polish layer (round 3) ============ */
      .hero { background-image: radial-gradient(circle at 88% -20%, rgba(239, 212, 107, 0.35), transparent 42%), radial-gradient(circle at -8% 118%, rgba(138, 154, 106, 0.16), transparent 46%), linear-gradient(135deg, #fdfcf4 0%, #f7f3dd 58%, #f3ead0 100%); }

      .stat-tile { transition: transform .16s, box-shadow .16s, border-color .16s; }

      .match-progress i, .progress-bar i { background: linear-gradient(90deg, #c9b23c, #e8d272); }

      .tag-chip:hover { filter: brightness(0.94); }
      .tile-tags i { font-style: normal; }
      .forecast-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px 14px; margin: 18px 0 24px; box-shadow: var(--shadow); }
      .forecast-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }

      .forecast-bar { width: 62%; min-height: 2px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #8a9a6a, #a5b38e); transition: height .3s ease; }

      .forecast-col b { font-size: .8rem; font-variant-numeric: tabular-nums; color: var(--ink); min-height: 1em; }
      .forecast-col span { font-size: .68rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
      .answer-review { width: 100%; max-width: 420px; margin: 10px auto 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card); text-align: left; }
      .answer-review summary { cursor: pointer; padding: 11px 16px; font-weight: 700; font-size: .9rem; color: var(--ink-soft); list-style: none; display: flex; align-items: center; gap: 8px; }

      .review-list { max-height: 340px; overflow-y: auto; border-top: 1px solid var(--line); }

      .theme-chip { background: var(--sage-soft); color: #55604a; border: 1px solid #dfe5cf; padding: 4px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }

      .rate-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; padding-top: 22px; }
      .rate-btn {
        border-radius: 12px; border: 1px solid var(--line-strong); background: var(--card);

      }

      .rate-btn.good { color: #6b6f2e; } .rate-btn.good:hover { border-color: #cdc98a; background: #fbfaef; }

      .card-progress { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }

      .card-progress .match-progress { flex: 1; margin-bottom: 0; }

      .complete-card { align-items: center; justify-content: center; text-align: center; gap: 10px; min-height: 380px; }

        width: 64px; height: 64px; border-radius: 50%; background: var(--yellow-soft); color: #8a6d1d;
        display: grid; place-items: center; margin-bottom: 6px;
      }

      .flash-aside { display: flex; flex-direction: column; gap: 15px; position: sticky; top: 24px; }
      .aside-card { background: var(--card); border: 1px solid var(--line); border-radius: 15px; padding: 17px 18px; box-shadow: var(--shadow); }
      .aside-card h3 { font-size: 0.98rem; margin-bottom: 10px; }

      .mastery-row:last-child { margin-bottom: 0; }
      .mastery-dot { width: 11px; height: 11px; border-radius: 4px; flex-shrink: 0; }
      .mastery-row b { margin-left: auto; font-family: var(--mono); font-size: 0.88rem; }
      .mastery-bar { height: 8px; border-radius: 999px; background: #eef0e4; overflow: hidden; display: flex; margin-top: 12px; }
      .mastery-bar i { height: 100%; transition: width 0.3s; }
      .kbd-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 0.86rem; color: var(--muted); }
      .kbd-row:last-child { border-bottom: 0; }
      .kbd-row kbd { font-family: var(--mono); font-size: 0.76rem; background: var(--soft); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 2px 7px; color: var(--ink-soft); }

      /* ============ MATCHING ============ */
      .matching-grid { display: grid; grid-template-columns: 1fr 52px 1fr; gap: 8px; align-items: stretch; }
      @media (max-width: 760px) { .matching-grid { grid-template-columns: 1fr; } .matching-link { display: none; } }
      .column-label {
        display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.14em;
        text-transform: uppercase; color: #7d8371; font-size: 0.72rem; font-weight: 800; margin: 2px 4px 9px;
      }
      .match-list { display: flex; flex-direction: column; gap: 9px; }
      .match-item {
        text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 13px;
        padding: 13px 15px; display: flex; align-items: center; gap: 12px; min-height: 62px;
        font-size: 0.98rem; line-height: 1.4; transition: border-color 0.15s, background 0.15s, transform 0.15s, opacity 0.2s;
        box-shadow: var(--shadow);
      }
      .match-item strong { font-weight: 700; font-family: var(--display); letter-spacing: -0.01em; font-size: 1rem; }
      .match-item:not(:disabled):hover { border-color: #c8cfb0; transform: translateY(-1px); }

      .match-item.matched { border-color: #b9cfa4; background: var(--ok-soft); opacity: 0.82; }

      .match-item.wrong { animation: shake 0.4s ease; border-color: #dba391; background: var(--danger-soft); }
      @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
      .match-number { font-family: var(--mono); font-size: 0.78rem; font-weight: 700; color: #7d8371; background: var(--soft); border-radius: 7px; padding: 4px 8px; flex-shrink: 0; }
      .match-check { margin-left: auto; color: var(--ok); display: grid; place-items: center; width: 22px; }
      .matching-link { display: grid; place-items: center; color: #c2c8b2; }
      .match-bottom { margin-top: 20px; min-height: 30px; color: var(--muted); font-size: 0.98rem; }
      .match-success {
        display: flex; align-items: center; gap: 15px; background: var(--ok-soft); border: 1px solid #cfe0bd;
        border-radius: 14px; padding: 16px 19px; color: #3f5a30;
      }

      .match-success p { font-size: 0.95rem; }
      .error-text { color: var(--danger); font-weight: 600; }

      /* ============ QUIZ ============ */
      .quiz-body h3 { font-size: 1.35rem; margin-bottom: 6px; }

      .quiz-clue.scene-name { font-family: var(--display); font-weight: 700; color: var(--ink); font-size: 1.15rem; }

      .quiz-topline b { color: var(--ink); font-size: 1rem; }

      .quiz-option {
        text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 13px;
        padding: 15px 16px; display: flex; align-items: center; gap: 13px; min-height: 64px; font-size: 0.98rem;
        font-weight: 600; line-height: 1.45; box-shadow: var(--shadow);
      }
      .quiz-option:not(:disabled):hover { border-color: #c8cfb0; transform: translateY(-1px); }
      .quiz-option:disabled { opacity: 0.88; }
      .quiz-option.correct { border-color: #9fbf83; background: var(--ok-soft); box-shadow: 0 0 0 3px rgba(165, 179, 142, 0.3); }
      .quiz-option.incorrect { border-color: #dba391; background: var(--danger-soft); }
      .option-letter {
        font-family: var(--mono); font-weight: 800; font-size: 0.85rem; color: #6d7564;

      }

      .quiz-option.incorrect .opt-check { color: var(--danger); }
      .quiz-feedback { border-radius: 13px; padding: 15px 18px; margin-top: 15px; font-size: 0.96rem; line-height: 1.6; animation: rise 0.25s ease; }
      @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
      .quiz-feedback.positive { background: var(--ok-soft); border: 1px solid #cfe0bd; color: #3c5730; }

      .result-top { display: flex; flex-direction: column; align-items: center; gap: 9px; margin-bottom: 20px; }
      .result-top h3 { font-size: 1.5rem; }
      .result-top p { color: var(--muted); max-width: 48ch; }
      .quiz-score { display: flex; align-items: baseline; gap: 7px; font-family: var(--display); }
      .quiz-score b { font-size: 2.9rem; letter-spacing: -0.04em; }
      .quiz-score span { font-size: 1.3rem; color: var(--muted); font-weight: 600; }
      .missed-scenes { text-align: left; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
      .revisit-row {
        display: flex; align-items: center; gap: 13px; background: var(--card); border: 1px solid var(--line);
        border-radius: 11px; padding: 11px 15px; font-size: 0.95rem; text-align: left;

      /* ============ RECALL ============ */
      .recall-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
      @media (max-width: 1000px) { .recall-layout { grid-template-columns: 1fr; } }
      .writing-area { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; box-shadow: var(--shadow); }
      .writing-area h3 { font-size: 1.3rem; margin-bottom: 6px; }

      .writing-meta span { display: inline-flex; align-items: center; gap: 6px; }

      .reference-panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; box-shadow: var(--shadow); }
      .reference-panel h3 { font-size: 1.25rem; margin-bottom: 12px; }

      .answer-label { display: block; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: #8a7420; font-weight: 800; margin-bottom: 5px; }
      .answer-block p { font-size: 0.94rem; line-height: 1.6; color: var(--ink-soft); }
      .self-check { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
      .self-check strong { font-size: 0.95rem; }
      .self-check label { display: flex; gap: 10px; align-items: flex-start; font-size: 0.92rem; font-weight: 500; color: var(--ink-soft); cursor: pointer; }
      .self-check input[type="checkbox"] { width: 19px; height: 19px; accent-color: #8a9a6a; margin-top: 2px; flex-shrink: 0; }
      .self-check small { color: var(--muted); font-size: 0.8rem; }
      .reference-art { display: grid; place-items: center; padding: 8px 0 14px; color: #6f7562; }
      .reference-art svg { width: min(250px, 100%); height: auto; }
      .reference-aside h3 { font-size: 1.2rem; margin-bottom: 6px; }
      .reference-aside p { color: var(--muted); font-size: 0.93rem; line-height: 1.6; }
      .reference-hint { display: flex; gap: 11px; background: var(--yellow-soft); border: 1px solid var(--yellow-line); border-radius: 11px; padding: 12px 14px; color: #6d5a14; font-size: 0.88rem; margin-top: 15px; }

      /* ============ LIBRARY ============ */
      .library-controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
      .library-controls .search-box { position: relative; flex: 1; min-width: 220px; max-width: 380px; }
      .library-controls .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
      .library-controls .search-box input { padding-left: 42px; min-height: 47px; }
      .chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
      .filter-chip {
        border: 1px solid var(--line-strong); background: var(--card); border-radius: 999px; padding: 8px 15px;
        font-size: 0.84rem; font-weight: 650; color: var(--muted); min-height: 40px;
      }
      .filter-chip:hover { border-color: #b9c1a6; color: var(--ink); }

      .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
      .scene-tile {
        text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px;

      }

      .scene-tile .tile-top { display: flex; align-items: center; justify-content: space-between; }

      .scene-tile .tile-save { width: 36px; height: 36px; }
      .scene-tile svg.art { width: 100%; height: auto; color: #6f7562; }
      .scene-tile h3 { font-size: 1.08rem; line-height: 1.3; }
      .scene-tile .tile-char { color: var(--muted); font-size: 0.84rem; font-weight: 600; }
      .library-count { color: var(--muted); font-size: 0.88rem; margin-bottom: 14px; }

      /* ============ PROGRESS ============ */
      .progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 13px; margin-bottom: 28px; }
      .scene-status-list { display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow-y: auto; padding: 3px; margin: -3px; }
      .status-row {
        display: flex; align-items: center; gap: 13px; background: var(--card); border: 1px solid var(--line);
        border-radius: 11px; padding: 11px 15px; font-size: 0.95rem;
      }
      .status-row .mono { color: #7d8371; font-size: 0.8rem; font-weight: 700; }
      .status-row .st-title { font-weight: 650; font-family: var(--display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status-pill { border-radius: 999px; font-size: 0.76rem; font-weight: 700; padding: 4px 12px; white-space: nowrap; }
      .status-pill.confident { background: var(--ok-soft); color: #44632f; }
      .status-pill.learning { background: var(--yellow-soft); color: #6d5a14; }
      .status-pill.new { background: var(--soft); color: #8d937f; }
      .status-pill.due { background: var(--danger-soft); color: var(--danger); }
      .progress-actions { display: flex; gap: 11px; margin-top: 24px; flex-wrap: wrap; }
      .section-gap { height: 30px; }
      .progress-h2 { font-size: 1.3rem; margin-bottom: 13px; }

      /* ============ SCENE SHEET MANAGER ============ */
      .sheet-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
      @media (max-width: 1000px) { .sheet-layout { grid-template-columns: 1fr; } }
      .sheet-card { background: var(--card); border: 1px solid var(--line); border-radius: 17px; padding: 22px 24px; box-shadow: var(--shadow); }
      .sheet-card h3 { font-size: 1.2rem; margin-bottom: 5px; }
      .sheet-card .sheet-sub { color: var(--muted); font-size: 0.93rem; margin-bottom: 17px; line-height: 1.6; }
      .sheet-source-badge {
        display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 5px 13px;
        font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 13px;
      }
      .sheet-source-badge.builtin { background: var(--sage-soft); color: #55604a; border: 1px solid #dfe5cf; }
      .sheet-source-badge.custom { background: var(--yellow-soft); color: #6d5a14; border: 1px solid var(--yellow-line); }
      .sheet-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 11px; margin-bottom: 17px; }
      .sheet-fact { background: #fbfcf5; border: 1px solid var(--line); border-radius: 11px; padding: 11px 14px; }
      .sheet-fact b { display: block; font-family: var(--display); font-size: 1.35rem; letter-spacing: -0.02em; }
      .sheet-fact span { color: var(--muted); font-size: 0.78rem; font-weight: 650; }
      .sheet-theme-tags { display: flex; flex-wrap: wrap; gap: 7px; }
      .dropzone {
        border: 2px dashed var(--line-strong); border-radius: 15px; background: #fdfef9;
        padding: 34px 24px; text-align: center; transition: border-color 0.18s, background 0.18s;
        cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 9px;
      }
      .dropzone:hover, .dropzone.dragover { border-color: #c5a130; background: #fffaea; }
      .dropzone .dz-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--yellow-soft); color: #8a6d1d; display: grid; place-items: center; }
      .dropzone b { font-size: 1.05rem; font-family: var(--display); }
      .dropzone p { color: var(--muted); font-size: 0.88rem; max-width: 46ch; line-height: 1.55; }
      .sheet-error {
        background: var(--danger-soft); border: 1px solid #eed3c9; color: #7d4030; border-radius: 12px;
        padding: 14px 17px; font-size: 0.93rem; line-height: 1.6; margin-top: 14px;
      }
      .sheet-error strong { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
      .sheet-error ul { margin: 8px 0 0; padding-left: 20px; }
      .sheet-ok {
        background: var(--ok-soft); border: 1px solid #cfe0bd; color: #3c5730; border-radius: 12px;
        padding: 14px 17px; font-size: 0.94rem; line-height: 1.6; margin-top: 14px;
        display: flex; gap: 11px; align-items: flex-start;
      }
      .sheet-tools { display: flex; flex-direction: column; gap: 15px; position: sticky; top: 24px; }
      .tool-list { display: flex; flex-direction: column; gap: 8px; }
      .tool-row {
        display: flex; align-items: center; gap: 13px; text-align: left; background: var(--card);
        border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px;
      }
      .tool-row:hover { border-color: #c8cfb0; background: #fdfef8; }
      .tool-row .tool-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
      .tool-row b { display: block; font-size: 0.94rem; }
      .tool-row small { color: var(--muted); font-size: 0.82rem; line-height: 1.4; display: block; }
      .tool-row .ti-yellow { background: var(--yellow-soft); color: #8a6d1d; }
      .tool-row .ti-sage { background: var(--sage-soft); color: #55604a; }
      .tool-row .ti-lav { background: var(--lav-soft); color: var(--lav); }
      .schema-note { background: var(--sidebar-bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 0.85rem; color: var(--ink-soft); line-height: 1.6; }
      .schema-note code { font-family: var(--mono); font-size: 0.8rem; background: #ecefe2; border-radius: 5px; padding: 1.5px 6px; }
      .schema-note details { margin-top: 8px; }
      .schema-note summary { cursor: pointer; font-weight: 700; color: var(--ink); font-size: 0.88rem; }
      .schema-note pre { background: #30352c; color: #f3f4ea; border-radius: 9px; padding: 13px 15px; overflow-x: auto; font-size: 0.78rem; line-height: 1.55; margin: 10px 0 0; }

      /* ============ MODAL & TOAST ============ */
      .modal-backdrop {
        position: fixed; inset: 0; z-index: 200; background: rgba(48, 53, 44, 0.45);
        backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px; animation: fade 0.18s ease;
      }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .modal {
        background: var(--paper); border-radius: 20px; max-width: 680px; width: 100%;
        max-height: min(86vh, 780px); display: flex; flex-direction: column; box-shadow: var(--shadow-lift);
        animation: pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      @keyframes pop { from { opacity: 0; transform: scale(0.94) translateY(10px); } to { opacity: 1; transform: none; } }
      .modal-head {
        display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
        padding: 22px 24px 14px; border-bottom: 1px solid var(--line);
      }
      .modal-head h2 { font-size: 1.35rem; letter-spacing: -0.02em; }
      .modal-body { padding: 20px 24px; overflow-y: auto; }
      .modal-intro { color: var(--ink-soft); font-size: 1rem; line-height: 1.65; margin-bottom: 18px; }
      .modal .scene-art-lg { display: grid; place-items: center; color: #6f7562; margin-bottom: 14px; }
      .modal .scene-art-lg svg { width: min(320px, 80%); }
      .detail-block { background: #fbfcf5; border: 1px solid var(--line); border-radius: 12px; padding: 14px 17px; margin-bottom: 11px; }
      .detail-block .answer-label { display: block; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: #8a7420; font-weight: 800; margin-bottom: 5px; }
      .detail-block p { font-size: 0.97rem; line-height: 1.65; color: var(--ink-soft); }
      .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
      .reset-actions { display: flex; gap: 11px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }

      .toast-root { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 9px; align-items: center; width: min(92vw, 480px); pointer-events: none; }
      .toast {
        background: var(--ink); color: #f5f6ec; border-radius: 12px; padding: 13px 19px;
        font-size: 0.93rem; font-weight: 600; box-shadow: var(--shadow-lift); display: flex; gap: 10px; align-items: center;
        animation: toastin 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.15); max-width: 100%;
      }
      .toast svg { color: var(--yellow); flex-shrink: 0; }
      .toast.leaving { opacity: 0; transform: translateY(8px); transition: opacity 0.25s, transform 0.25s; }
      @keyframes toastin { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }

      @media (max-width: 560px) {
        .hero { padding: 24px 20px; }
        .flashcard { padding: 22px 18px; min-height: 400px; }
        .fc-title { font-size: 1.28rem; }
        .rate-row { grid-template-columns: 1fr; }
        .rate-btn { flex-direction: row; justify-content: space-between; min-height: 52px; padding: 10px 16px; }
        .quiz-options { grid-template-columns: 1fr; }
        .section-toolbar h2 { font-size: 1.32rem; }
        .view-wrap { padding: 18px 13px 30px; }
      }

      @media print { .sidebar, .mobile-topbar, .app-footer { display: none !important; } .main-area { margin: 0; } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
      /* ============ THEME TOGGLE BUTTONS ============ */
      .theme-toggle {
        display: flex; align-items: center; gap: 9px; width: 100%; justify-content: flex-start;
        background: transparent; border: 1px solid var(--line-strong); color: var(--ink-soft);
        border-radius: 11px; padding: 9px 12px; font-size: 0.85rem; font-weight: 600; margin-bottom: 10px;
      }
      .theme-toggle:hover { background: var(--sage-soft); color: var(--ink); border-color: var(--muted); }
      .topbar-theme {
        display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0;
        background: transparent; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--ink);
      }
      .topbar-theme:hover { background: var(--sage-soft); }
      .topbar-theme span { display: none; }
      .theme-toggle svg, .topbar-theme svg { flex-shrink: 0; }

      /* ============ MASTERY BY ESSAY TAG ============ */
      .mastery-hint { font-size: 0.72rem; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; margin-left: 9px; }
      .tagstat-list {
        display: flex; flex-direction: column; gap: 9px; background: var(--card);
        border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 28px;
        box-shadow: var(--shadow);
      }
      .tagstat-row { display: grid; grid-template-columns: minmax(120px, 185px) 62px 1fr 46px auto; align-items: center; gap: 12px; }
      .tagstat-row .tag-chip { justify-self: start; }
      .practice-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 34px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink-soft); font: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease; white-space: nowrap; }
      .practice-btn:hover { background: var(--yellow-soft); border-color: var(--yellow-line); color: var(--yellow-ink-deep); transform: translateY(-1px); }
      .practice-btn:active { transform: translateY(0); }
      .tag-chip-btn { font: inherit; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
      .tag-chip-btn:hover { transform: translateY(-1px); box-shadow: 0 3px 10px -4px rgba(0, 0, 0, 0.3); }
      .tagrow-hint { color: var(--muted); font-size: 0.72rem; font-weight: 600; }
      .breakdown-cap { display: block; font-family: var(--mono); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.13em; color: var(--muted); margin-bottom: 7px; }
      .skill-breakdown + .skill-breakdown { margin-top: 10px; }
      .search-box kbd.search-kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-family: var(--mono); background: var(--soft); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 1px 7px; font-size: 0.72rem; color: var(--muted); pointer-events: none; transition: opacity .12s ease; }
      .search-box:focus-within kbd.search-kbd { opacity: 0; }
      .tile-cue { display: none; }
      .tagstat-n { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
      .tagstat-barwrap { height: 9px; border-radius: 99px; background: var(--soft); overflow: hidden; }
      .tagstat-bar { display: block; height: 100%; border-radius: 99px; transition: width 0.5s ease; min-width: 2%; }
      .tagstat-pct { font-size: 0.8rem; text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      @media (max-width: 640px) {
        .tagstat-row { grid-template-columns: 1fr auto auto; }
        .tagstat-row .tag-chip { grid-column: 1 / -1; margin-bottom: -4px; }
        .tagstat-n { display: none; }
      }

      /* ============ DARK THEME ============ */
      html[data-theme="dark"] {
        color-scheme: dark;
        --ink: #eceade; --ink-soft: #c8c6b4; --muted: #97947e;
        --line: #363a2d; --line-strong: #474b3a;
        --yellow: #efd46b; --yellow-deep: #e0b52f; --yellow-soft: #3f3a1d;
        --yellow-hover: #4a431f; --yellow-ink-deep: #f5e6a8; --yellow-line: #6b5f22;
        --paper: #15170f; --card: #1f2219; --soft: #2a2d21;
        --sage: #a5b38e; --sage-soft: #262b1e;
        --danger: #d2604c; --danger-soft: #38241d; --danger-line: #5c352a;
        --ok: #90b578; --ok-soft: #252e1c;
        --lav: #ab9ecb; --lav-soft: #2b2737;
        --footer-bg: #181a12; --sidebar-bg: #191b13; --topbar-bg: rgba(21, 23, 15, 0.92);
        --hero-grad: linear-gradient(135deg, #232619 0%, #1f2317 58%, #26220f 100%);
        --hero-border: #3c3a24; --hero-chip-bg: rgba(236, 233, 222, 0.06);
        --hero-chip-line: #45412a; --hero-chip-text: #e5d891;
        --dot: rgba(236, 233, 222, 0.06);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.5);
        --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.35), 0 16px 40px -14px rgba(0, 0, 0, 0.6);
      }
      html[data-theme="dark"] body { background: var(--paper); color: var(--ink); }
      html[data-theme="dark"] .workspace-label { color: #7d816d; }
      html[data-theme="dark"] .brand-dot { color: #c5a130; }
      html[data-theme="dark"] .hero::after { opacity: 0.55; }
      html[data-theme="dark"] .stat-tile.accent { background: linear-gradient(150deg, #2c2914, #3a3313); border-color: #6b5f22; }
      html[data-theme="dark"] .stat-tile.accent .stat-num { color: #f5e6a8; }
      html[data-theme="dark"] .hero {
        background-image: radial-gradient(circle at 88% -20%, rgba(239, 212, 107, 0.16), transparent 42%),
          radial-gradient(circle at -8% 118%, rgba(165, 179, 142, 0.1), transparent 46%),
          linear-gradient(135deg, #232619 0%, #1f2317 58%, #26220f 100%);
        border-color: #3c3a24;
      }
      html[data-theme="dark"] .hero .hero-chip { background: rgba(236, 233, 222, 0.07); }
      /* inverted-surface components: dark text needed when --ink flips light */
      html[data-theme="dark"] .button.primary, html[data-theme="dark"] .filter-chip.active { color: #15170f; }
      html[data-theme="dark"] .toast { color: #15170f; }
      /* hardcoded light surfaces → dark equivalents */
      html[data-theme="dark"] .stat-tile.streak { border-color: #6b5f22; background: linear-gradient(160deg, #2c2914 0%, #33290f 100%); }
      html[data-theme="dark"] .forecast-barwrap, html[data-theme="dark"] .fc-block, html[data-theme="dark"] .detail-block,
      html[data-theme="dark"] .answer-block, html[data-theme="dark"] .technique-footer, html[data-theme="dark"] .empty-note,
      html[data-theme="dark"] .sheet-fact { background: #262920; }
      html[data-theme="dark"] .setup-icn { background: #262920; color: #b9c1a6; }
      html[data-theme="dark"] .match-progress { background: #262920; border-color: #3a3e2f; }
      html[data-theme="dark"] .match-item.selected { background: #3a3313; box-shadow: 0 0 0 3px rgba(239, 212, 107, 0.18); }
      html[data-theme="dark"] .match-item.matched strong { color: #a9c68d; }
      html[data-theme="dark"] .activity-instructions { border-color: #3d442f; color: #b9c8a0; }
      html[data-theme="dark"] .activity-instructions span { color: #d0d8b8; }
      html[data-theme="dark"] .quiz-feedback.positive { border-color: #3d4a2e; color: #c9dba8; }
      html[data-theme="dark"] .quiz-feedback.negative { border-color: #5c352a; color: #eba895; }
      html[data-theme="dark"] .revisit-row:hover { background: #262920; border-color: var(--line-strong); }
      html[data-theme="dark"] .theme-chip, html[data-theme="dark"] .sheet-source-badge.builtin { color: #b9c8a0; border-color: #3d442f; }
      html[data-theme="dark"] .detail-block .answer-label { color: #d9bd4a; }
      html[data-theme="dark"] .dropzone:hover, html[data-theme="dark"] .dropzone.dragover { background: #3a3313; }
      html[data-theme="dark"] .dropzone .dz-icon { color: #d9bd4a; }
      html[data-theme="dark"] .modal .scene-art-lg { color: #9ba18c; }

      /* ============ V2.4 POLISH LAYER ============ */
      /* Frosted modal backdrop */
      .modal-backdrop { background: rgba(38, 41, 32, 0.42); backdrop-filter: blur(5px) saturate(1.08); -webkit-backdrop-filter: blur(5px) saturate(1.08); animation: fadein 0.18s ease; }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      /* Focus-visible rings for keyboard users */
      .scene-tile:focus-visible, .filter-chip:focus-visible, .button:focus-visible, .nav-item:focus-visible,
      .rate-btn:focus-visible, .tag-chip-btn:focus-visible, .tool-row:focus-visible, .kbd-help-btn:focus-visible {
        outline: 2.5px solid #b8941c; outline-offset: 2px; border-radius: inherit;
      }
      .scene-tile:focus-visible { border-radius: 14px; }
      /* Mastery rings on library tiles */
      .scene-tile .tile-num { display: inline-flex; align-items: center; gap: 7px; }
      .tile-ring { width: 17px; height: 17px; flex: none; display: inline-block; }
      .tile-ring svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
      .tile-ring .ring-track { fill: none; stroke: var(--line); stroke-width: 3; }
      .tile-ring .ring-fill { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dasharray 0.5s ease, stroke 0.3s ease; }
      .scene-tile:hover .tile-ring .ring-track { stroke: var(--line-strong); }
      /* Mastery chip in scene modal */
      .mastery-chip.mastery-learning { color: #8a7420; border-color: #d9bd4a66; background: #efd46b1c; }
      .mastery-chip.mastery-confident { color: #5f7047; border-color: #8a9a6a66; background: #8a9a6a1c; }
      html[data-theme="dark"] .mastery-chip.mastery-learning { color: #e8ca62; border-color: #5c5426; background: #33301a; }
      html[data-theme="dark"] .mastery-chip.mastery-confident { color: #b9c8a0; border-color: #3d442f; background: #2a2f20; }
      /* Keyboard shortcut cheat sheet */
      .sc-cap { font-family: var(--mono); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em; color: #8a7420; margin: 18px 0 6px; }
      .sc-cap:first-of-type { margin-top: 4px; }
      .sc-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 8px 2px; border-bottom: 1px dashed var(--line); font-size: 0.95rem; }
      .sc-row:last-child { border-bottom: 0; }
      .sc-row b { font-weight: 600; color: var(--ink); }
      .sc-keys { display: flex; gap: 6px; flex: none; }
      .modal-head h2 svg { vertical-align: -3px; margin-right: 6px; }
      html[data-theme="dark"] .sc-cap { color: #d9bd4a; }
      /* Sidebar keyboard-help button */
      .kbd-help-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; align-self: flex-start; min-height: 44px; min-width: 44px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--card); color: var(--ink-soft); cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease; }
      .kbd-help-btn:hover { border-color: #b8941c; color: var(--ink); transform: translateY(-1px); }
      .kbd-help-btn kbd { font-size: 0.78rem; }
      html[data-theme="dark"] .kbd-help-btn { background: #23261c; border-color: #3a3f2e; color: #b6bca6; }
      html[data-theme="dark"] .kbd-help-btn:hover { border-color: #d9bd4a; color: #efe9cf; }
      /* Restore-backup summary facts */
      .restore-facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0 18px; }
      .restore-facts .fact { background: var(--soft); border: 1px solid var(--line); border-radius: 11px; padding: 11px 8px 9px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
      .restore-facts .fact b { font-size: 1.35rem; line-height: 1.1; color: var(--ink); }
      .restore-facts .fact span { font-size: 0.74rem; color: var(--muted); letter-spacing: 0.02em; }
      @media (max-width: 560px) { .restore-facts { grid-template-columns: repeat(2, 1fr); } }

      /* ============ PRINT STUDY PACK ============ */
      .print-only { display: none; }
      @media print {
        :root, html[data-theme="dark"] {
          --paper: #fff; --card: #fff; --soft: #f0f1e6;
          --ink: #1c1e15; --ink-soft: #3a3d31; --muted: #6a6f5c;
          --line: #c9cdbb; --line-strong: #b3b7a4;
          --yellow-soft: #faf3d4; --sage-soft: #eef1e4;
          --sidebar-bg: #fff; --footer-bg: #fff; --topbar-bg: #fff;
          --shadow: none; --shadow-lift: none;
        }
        body { background: #fff !important; }
        .sidebar, .mobile-topbar, .app-footer, .toast-root, .sidebar-overlay,
        .library-controls, .section-toolbar, .chip-row, .library-count,
        .icon-button, .menu-btn, .theme-toggle, .topbar-theme { display: none !important; }
        .print-only { display: block; }
        .print-head { margin-bottom: 20px; border-bottom: 2px solid #1c1e15; padding-bottom: 10px; }
        .print-head h1 { font-family: var(--display); font-size: 22pt; margin: 0 0 4px; letter-spacing: -0.02em; }
        .print-head p { margin: 0; color: #555; font-size: 9.5pt; }
        .main-area { padding: 0 !important; }
