        /* ================= BUILT-IN SCENE SHEET ================= */
        const BUILTIN_SCENES = [{"id":1,"title":"The childhood prologue","fullTitle":"The Childhood Prologue (1926 White Sulphur Springs)","character":"Katherine Johnson","analysisType":"Character essay","themes":["Education & opportunity","Merit & recognition"],"description":"In 1926 at White Sulphur Springs, eight-year-old Katherine Coleman counts prime numbers along a gravel path and identifies geometric shapes (isosceles, rhombus, dodecahedron) in the window panes of her grammar school.","techniques":"Point-of-view (POV) visual overlays make geometric patterns light up in her mind's eye, paired with a gentle, inquisitive voiceover.","essay":"Establishes Katherine's natural intellectual gifts and her lifelong commitment to education. Her mathematical mastery is grounded in deep personal dedication rather than accidental luck.","techniqueLabel":"POV geometric overlays","meaningLabel":"Intellectual gifts nurtured by education","cue":"geometry","cueText":"Shapes in a school window: Katherine sees mathematics in the world around her.","tags":["education","opportunity","merit"]},{"id":2,"title":"Speaking geometry","fullTitle":"Katherine Defending Her Analytic Geometry Credentials","character":"Katherine Johnson","analysisType":"Character essay","themes":["Merit & recognition","Education & opportunity","Gender & dignity"],"description":"When Director Al Harrison skeptically asks if she knows analytic geometry and \"speaks,\" Katherine interjects that she speaks both geometry and English. She completes Harrison's thought about the Gram-Schmidt orthogonalization algorithm, noting her preference for it over Euclidean coordinates.","techniques":"Rapid-fire dialogue editing, camera panning across the quiet Task Group floor, and sharp character blocking.","essay":"Shows how academic excellence functions as a defensive shield, or \"armor,\" against assumptions of inferiority, instantly earning her professional standing.","techniqueLabel":"Rapid-fire dialogue & sharp blocking","meaningLabel":"Academic excellence as armor","cue":"equations","cueText":"An orthogonal coordinate system: Katherine answers doubt with precise mathematical knowledge.","tags":["sexism","merit","dignity"]},{"id":3,"title":"The wind tunnel conversation","fullTitle":"Mary Jackson's Discussion with Karl Zielinski at the Wind Tunnel","character":"Mary Jackson","analysisType":"Theme essay","themes":["Education & opportunity","Gender & dignity","Racism & segregation"],"description":"After Mary's high heel gets stuck in the wind tunnel grate under the Mercury 7 prototype capsule, engineer Karl Zielinski encourages her to join the engineer training program. Asked if she would wish to be an engineer if she were a white male, Mary replies: \"I wouldn't have to. I'd already be one.\"","techniques":"Deep-focus framing under the massive metallic turbines of the wind tunnel, with industrial shadows emphasizing social barriers.","essay":"Reveals character awareness and privilege. In one sentence, Mary exposes the difference between innate talent and structural opportunity.","techniqueLabel":"Deep focus & industrial shadows","meaningLabel":"Talent is not the same as opportunity","cue":"turbine","cueText":"A turbine and a trapped heel: Mary's ability is real, but the structure holds her back.","tags":["racism","sexism","opportunity","intersectionality"]},{"id":4,"title":"Glasses, not skirts","fullTitle":"Church Community Gathering and Jim Johnson's Initial Misstep","character":"Katherine Johnson","analysisType":"Character essay","themes":["Gender & dignity","Leadership & community"],"description":"At a Sunday church gathering, Colonel Jim Johnson expresses surprise that NASA allows women to perform taxing aeronautical calculations. Katherine lists her advanced degrees and daily workload: \"So, yes... they let women do some things over at NASA, Mr. Johnson. But it's not because we wear skirts... it's because we wear glasses.\"","techniques":"Warm amber lighting reflects community strength, contrasted with sharp, articulate dialogue framing.","essay":"Demonstrates Katherine's refusal to accept gender stereotypes in either her personal or professional life, illustrating self-respect and personal dignity.","techniqueLabel":"Warm light & articulate dialogue","meaningLabel":"Self-respect challenges gender stereotypes","cue":"church","cueText":"Glasses in front of a church: Katherine insists that expertise, not clothing, defines her.","tags":["sexism","dignity"]},{"id":7,"title":"An unexpected police escort","fullTitle":"The Stranded Car and Highway Police Escort","character":"NASA & the team","analysisType":"Theme essay","themes":["Cold War & progress","Racism & segregation","Merit & recognition"],"description":"Stranded beside Dorothy's broken-down 1955 Chevy Impala on a rural Virginia highway, the three women are approached by a suspicious white police officer. After showing their NASA badges and explaining their rocket-trajectory work against the Soviet Union, they receive a high-speed police escort.","techniques":"Low-angle shots establish initial power dynamics; fluid tracking shots and comedic irony accompany the high-speed escort.","essay":"Introduces the idea that Cold War national utility and professional competence can force white authority figures to set aside racial prejudice.","techniqueLabel":"Low angles, tracking & comic irony","meaningLabel":"National utility unsettles prejudice","cue":"car","cueText":"A car behind a flashing escort: suspicion turns into assistance when their work becomes visible.","tags":["racism","coldwar","merit"]},{"id":8,"title":"The Cold War crisis briefing","fullTitle":"Administrator Jim Webb's Cold War Crisis Briefing","character":"NASA & the team","analysisType":"Theme essay","themes":["Cold War & progress","Technology & change"],"description":"NASA Administrator Jim Webb watches newsreel footage of the Soviet Union launching Sputnik and detonating nuclear warheads. He berates NASA engineers for inaction, declaring that the nation is losing the Space Race and demanding immediate progress.","techniques":"Stark room lighting, harsh newsreel projection across Webb's back, and tense diegetic silence.","essay":"Establishes the geopolitical pressure driving the film. It highlights the irrationality of maintaining discrimination when national survival requires all available talent.","techniqueLabel":"Harsh projection & tense silence","meaningLabel":"Geopolitical pressure demands all talent","cue":"satellite","cueText":"Sputnik on a projection screen: external pressure exposes the cost of internal exclusion.","tags":["coldwar","technology","leadership"]},{"id":9,"title":"The separate coffee pot","fullTitle":"The \"Colored\" Coffee Pot Microaggression","character":"Katherine Johnson","analysisType":"Theme essay","themes":["Racism & segregation","Gender & dignity"],"description":"After Katherine pours coffee from the main Task Group coffee maker, her white male colleagues stare in uncomfortable silence. The next day, a separate, smaller pot labeled \"COLORED\" is placed on a side table for her.","techniques":"Mise-en-scene prop placement, multi-character reaction shots, and awkward diegetic silence.","essay":"Demonstrates that discrimination is not always violent; everyday, mundane microaggressions can alienate essential workers.","techniqueLabel":"Coffee-pot mise-en-scene & silence","meaningLabel":"Ordinary objects enforce exclusion","cue":"coffee","cueText":"Two unequal coffee pots: a mundane workplace object becomes a boundary of segregation.","tags":["racism","segregation","dignity","intersectionality"]},{"id":10,"title":"The half-mile bathroom sprint","fullTitle":"The Half-Mile Bathroom Sprint Sequence","character":"Katherine Johnson","analysisType":"Theme essay","themes":["Racism & segregation","Merit & recognition"],"description":"Because the East Campus lacks segregated facilities, Katherine repeatedly runs half a mile back to West Campus in high heels, clutching heavy data folders in the rain.","techniques":"Rhythmic montage editing set to Pharrell Williams' \"Runnin',\" continuous tracking shots, and repetitive cross-cutting.","essay":"Visually quantifies the physical and temporal tax of segregation. Discrimination is inefficient because it wastes the working hours of NASA's most talented personnel.","techniqueLabel":"Rhythmic montage & repeated tracking","meaningLabel":"Segregation taxes time and labor","cue":"running","cueText":"A dotted half-mile route: every trip makes the cost of discrimination measurable.","tags":["racism","segregation","perseverance","injustice"]},{"id":11,"title":"The IBM that would not fit","fullTitle":"The Arrival of the IBM 7090 Mainframe","character":"NASA & the team","analysisType":"Theme essay","themes":["Technology & change","Leadership & community"],"description":"NASA technicians try to move the massive IBM 7090 into the building, then discover that it is too large for the doorway. Carpenters must saw away the door header.","techniques":"Wide-angle contrast between human scale and massive industrial hardware, paired with humorous dialogue.","essay":"Represents technological disruption and institutional unpreparedness. NASA invests in hardware while overlooking the human labor needed to operate it.","techniqueLabel":"Wide-angle human-machine contrast","meaningLabel":"Hardware investment overlooks human skill","cue":"computer","cueText":"A mainframe wider than a doorway: technology arrives faster than the institution adapts.","tags":["technology","merit"]},{"id":13,"title":"Fast rockets, slow advancement","fullTitle":"Vivian Mitchell Rejecting Dorothy's Supervisor Promotion","character":"Dorothy Vaughan","analysisType":"Theme essay","themes":["Racism & segregation","Leadership & community"],"description":"Dorothy asks Vivian Mitchell about her permanent supervisor application. Vivian coldly says NASA is not assigning a permanent supervisor to the \"Colored Group\": \"That's NASA for ya. Fast with rocket ships. Slow with advancement.\"","techniques":"Restrained two-shot framing, neutral eye lines, and a passive tone of voice.","essay":"Shows how institutional gatekeeping uses bureaucratic rules to maintain inequality without needing open hostility.","techniqueLabel":"Restrained two-shot & passive tone","meaningLabel":"Bureaucratic rules maintain inequality","cue":"hallway","cueText":"A closed promotion door: apparently neutral procedures still keep people out.","tags":["racism","injustice"]},{"id":14,"title":"The blacked-out research report","fullTitle":"Paul Stafford Redacting Research Reports","character":"Katherine Johnson","analysisType":"Theme essay","themes":["Racism & segregation","Merit & recognition"],"description":"Paul Stafford drops a heavy research report on Katherine's desk, with large sections blacked out in thick marker. He tells her she cannot read classified data because she lacks security clearance.","techniques":"A close-up insert of marker bleeding through paper, with low-angle framing emphasizing Stafford's condescension.","essay":"Exposes the use of administrative rules and clearance levels as tools of information suppression, keeping marginalized workers from full participation.","techniqueLabel":"Redacted-page insert & low angle","meaningLabel":"Information control blocks participation","cue":"report","cueText":"A page covered in black bars: access to information becomes access to power.","tags":["racism","injustice","merit"]},{"id":15,"title":"The rain-soaked outburst","fullTitle":"Katherine's \"Timbuktu\" Space Task Group Outburst","character":"Katherine Johnson","analysisType":"Character essay","themes":["Racism & segregation","Gender & dignity","Merit & recognition"],"description":"Returning soaked from the rain, Katherine is challenged about her forty-minute absences. She passionately explains the reality of segregated restrooms, dress codes, lower pay, and separate coffee pots in front of the silent room.","techniques":"Dramatic close-ups of Katherine's rain-soaked face, complete background diegetic silence, and wide reaction shots of shocked colleagues.","essay":"A major turning point: silent endurance becomes active resistance, forcing the institution to face its structural contradictions.","techniqueLabel":"Rain-soaked close-up & silent reactions","meaningLabel":"Silent endurance becomes active resistance","cue":"rain","cueText":"Rain above a speaking figure: Katherine makes the invisible burden impossible to ignore.","tags":["racism","sexism","courage","dignity"]},{"id":16,"title":"The restroom sign comes down","fullTitle":"Al Harrison Smashing the \"Colored Restroom\" Sign","character":"NASA & the team","analysisType":"Theme essay","themes":["Racism & segregation","Cold War & progress"],"description":"Angered by lost productivity, Al Harrison uses a crowbar to knock the metal \"Colored Restroom\" sign off the wall, declaring: \"At NASA we all... pee the same color!\"","techniques":"Action blocking, low-angle framing, and the physical destruction of a significant symbolic prop.","essay":"Represents top-down institutional adaptation driven by pragmatic necessity rather than pure altruism.","techniqueLabel":"Low-angle destruction of a symbolic prop","meaningLabel":"Pragmatic necessity drives institutional change","cue":"sign","cueText":"A broken sign: a physical barrier falls when its institutional cost is confronted.","tags":["racism","segregation","alliance"]},{"id":19,"title":"The blackboard breakthrough","fullTitle":"The Pentagon Briefing and Blackboard Trajectory Breakthrough","character":"Katherine Johnson","analysisType":"Character essay","themes":["Merit & recognition","Gender & dignity","Cold War & progress"],"description":"Katherine demands access to high-level briefings to track changing rocket masses. At the floor-to-ceiling blackboard, she calculates the Go/No Go orbital re-entry point using Euler's Method before military brass and astronauts.","techniques":"Racking focus between rapid chalk scrawls and male engineers' reactions, accompanied by low-angle camera tilts.","essay":"The climax of intellectual authority: mathematical capability outweighs institutional prejudice.","techniqueLabel":"Racking focus on chalk & low-angle tilts","meaningLabel":"Mathematical ability establishes authority","cue":"chalkboard","cueText":"A blackboard with an orbital curve: knowledge puts Katherine at the center of the room.","tags":["merit","sexism","coldwar"]},{"id":20,"title":"Get the girl to check the numbers","fullTitle":"John Glenn's Pre-Flight Demand (\"Get the Girl to Check the Numbers\")","character":"Katherine Johnson","analysisType":"Theme essay","themes":["Merit & recognition","Technology & change","Cold War & progress"],"description":"Minutes before launching aboard Friendship 7, John Glenn distrusts the IBM calculations and asks Katherine to manually verify the trajectory coordinates.","techniques":"Fast-paced parallel cross-cutting between Glenn's capsule at Cape Canaveral and Katherine calculating at Langley, intensified by ticking audio cues.","essay":"The ultimate desegregation of trust: in life-or-death conditions, true merit and accuracy replace racial and gender prejudice.","techniqueLabel":"Parallel cross-cutting & ticking audio","meaningLabel":"Life-or-death trust recognizes true merit","cue":"orbit","cueText":"An orbit checked by hand: a life depends on Katherine's trusted calculations.","tags":["merit","alliance","coldwar"]},{"id":21,"title":"The gift of pearls","fullTitle":"The Gift of the Pearl Necklace","character":"Katherine Johnson","analysisType":"Character essay","themes":["Merit & recognition","Gender & dignity","Leadership & community"],"description":"Before Katherine is reassigned to West Campus due to IBM automation, secretary Ruth presents her with a white pearl necklace paid for by the Task Group.","techniques":"A close-up insert of the necklace recalls the dress-code restrictions mentioned when she first arrived.","essay":"Symbolizes personal shifts and informal institutional acceptance, resolving Katherine's initial isolation.","techniqueLabel":"Pearl-necklace close-up & visual callback","meaningLabel":"A personal gift signals acceptance","cue":"pearls","cueText":"A string of pearls: an exclusionary dress rule is recalled through a gesture of belonging.","tags":["dignity","solidarity","merit"]},{"id":22,"title":"Coffee and shared credit","fullTitle":"Paul Stafford Bringing Coffee and Sharing Report Credit","character":"Katherine Johnson","analysisType":"Character essay","themes":["Merit & recognition","Racism & segregation","Leadership & community"],"description":"In the film's final moments, Stafford places coffee on Katherine's desk and gives her a report titled \"Notes on Space Technology by Paul Stafford and Katherine Johnson.\"","techniques":"Quiet two-shot framing, soft lighting, and a subtle nod of mutual respect.","essay":"Resolves the workplace conflict, suggesting that sustained professional excellence and shared goals can overcome individual prejudice.","techniqueLabel":"Soft two-shot & a nod of respect","meaningLabel":"Shared goals lead to mutual recognition","cue":"sharedcoffee","cueText":"Coffee beside two names on a report: ordinary objects now express inclusion, not exclusion.","tags":["racism","solidarity","merit","dignity"]},{"id":24,"title":"The bathroom exchange with Vivian","fullTitle":"Vivian Mitchell and Dorothy Vaughan in the Restroom","character":"Dorothy Vaughan","analysisType":"Theme essay","themes":["Racism & segregation","Gender & dignity"],"description":"In the restroom, Vivian Mitchell tells Dorothy that despite what she may think, she bears no personal animosity toward the Black computers. Dorothy dries her hands and quietly replies that she is sure Vivian truly believes that.","techniques":"A symmetrical mirror shot frames both women side by side in neutral lighting, the mirror doubling the pair and holding them at a polite, equal-looking distance.","essay":"Examines unconscious bias: a person can take part in systemic injustice while sincerely believing themselves free of prejudice. Politeness is not fairness.","techniqueLabel":"Symmetrical mirror framing","meaningLabel":"Unconscious bias sustains systemic injustice","cue":"mirror","cueText":"Two figures in a bathroom mirror: quiet words expose passive complicity.","tags":["racism","dignity","injustice"]},{"id":25,"title":"Family dinner trajectory talk","fullTitle":"Katherine Discussing Math with Her Daughters at Dinner","character":"Katherine Johnson","analysisType":"Character essay","themes":["Education & opportunity","Leadership & community"],"description":"At the dinner table, Katherine turns plates and household objects into orbital diagrams, explaining rocket trajectories to her young daughters — then tucks them in with the same patience she brings to a blackboard.","techniques":"Warm family lighting and intimate medium close-ups contrast with the sterile fluorescent offices at NASA, making the home the film's friendliest classroom.","essay":"Shows Katherine passing her passion for education and mathematical curiosity to the next generation, grounding her professional brilliance in family life.","techniqueLabel":"Warm family lighting & medium close-ups","meaningLabel":"Passing intellectual passion to new generations","cue":"dinner","cueText":"Plates converted into orbital paths: education begins at home.","tags":["education","family","opportunity"]},{"id":28,"title":"Euler's method proposal","fullTitle":"Katherine Proposing Numerical Methods for Re-entry","character":"Katherine Johnson","analysisType":"Character essay","themes":["Merit & recognition","Technology & change"],"description":"When the familiar formulas fail for an elliptical orbit, Katherine proposes Euler's Method — a numerical technique centuries old — as the way to calculate the capsule's path. The room doubts it; she insists that what matters is that it works.","techniques":"Tight close-ups on handwritten equations, combined with a slow camera push-in on Katherine as she speaks with quiet certainty.","essay":"Highlights Katherine's deep knowledge of classical mathematics, showing how foundational theory — patiently learned — solves cutting-edge engineering problems.","techniqueLabel":"Equation close-ups & slow push-in","meaningLabel":"Foundational knowledge solves novel challenges","cue":"euler","cueText":"Old formulas on paper: classic mathematics enables modern spaceflight.","tags":["merit","technology","education"]},{"id":29,"title":"The security clearance hurdle","fullTitle":"Katherine Denied Access to Pentagon Briefings","character":"Katherine Johnson","analysisType":"Theme essay","themes":["Gender & dignity","Merit & recognition"],"description":"Katherine asks why she cannot attend the daily briefings where the trajectory inputs are decided. Paul Stafford answers that it is not her clearance that bars her — it is custom: women do not sit in that room.","techniques":"Over-the-shoulder framing builds a visual wall between Katherine and the meeting-room door, holding her outside the conversation.","essay":"Analyses how unspoken gender protocols and institutional traditions exclude qualified women from decision-making spaces — barriers no rulebook names.","techniqueLabel":"Over-the-shoulder barrier framing","meaningLabel":"Customs function as barriers to entry","cue":"door","cueText":"A closed glass door: tradition keeps talent out of important rooms.","tags":["sexism","injustice","merit"]},{"id":30,"title":"The post-launch celebration","fullTitle":"The Control Room Celebration After Friendship 7 Re-entry","character":"NASA & the team","analysisType":"Theme essay","themes":["Cold War & progress","Merit & recognition","Leadership & community"],"description":"As John Glenn splashes down safely after three orbits, the control room erupts — engineers leap, hug, and cheer. Across the crowded room, Al Harrison finds Katherine's eyes and gives her an approving nod.","techniques":"A slow panning crowd shot moves the room from held-breath panic to collective relief, letting the whole team share one frame.","essay":"Demonstrates the power of shared goals to unite people across historic divides — the victory belongs to everyone in the room, and Katherine is visibly part of it.","techniqueLabel":"Slow pan from tension to relief","meaningLabel":"Shared goals bring unity and triumph","cue":"cheering","cueText":"A cheering control room: shared success overcomes personal division.","tags":["coldwar","merit","solidarity"]}];
        const BUILTIN_SHEET = {
          name: 'Hidden Figures',
          description: 'Twenty-two key scenes from Hidden Figures (2016), selected for essay writing — each one anchors a theme essay or a character study of Katherine Johnson, the NASA mathematician who helped launch John Glenn into orbit.',

        /* ================= ESSAY TAGS (informed by published analyses of Hidden Figures) ================= */
        const TAGS = {
          racism: { label: 'Racism', def: 'racial prejudice built into rules, spaces and everyday habits' },
          sexism: { label: 'Sexism', def: 'assumptions about what women can or cannot do' },

        const THEME_TO_TAGS = {

        function tagsOf(scene) {

          const derived = [];

        const tagLabel = (t) => (TAGS[t] && TAGS[t].label) || t;
        const tagDef = (t) => (TAGS[t] && TAGS[t].def) || 'a key idea for your essay';

        const getTagUniverse = () => {

        /* Curated essay content — theses, turning points and counter-claims used by the quiz engine */
        const THESES = [
          { text: 'Discrimination in Hidden Figures is not just personal prejudice — it is built into everyday rules and routines.', tags: ['racism', 'segregation'], scene: 9 },
          { text: 'Racism and sexism compound each other in a single life, creating a barrier neither would create alone.', tags: ['intersectionality', 'racism', 'sexism'], scene: 3 },
          { text: 'Education is handed down at home as well as won at school — a passion for learning is inherited.', tags: ['education', 'family'], scene: 25 },
          { text: 'Institutions only change when discrimination becomes visibly costly to them.', tags: ['racism', 'alliance'], scene: 16 },
          { text: 'Custom and “the way things are done” can exclude people as firmly as any written rule.', tags: ['sexism', 'injustice'], scene: 29 },
          { text: 'People can take part in injustice while sincerely believing they are free of prejudice.', tags: ['racism', 'injustice'], scene: 24 },
          { text: 'Progress is measured in shared victories, not individual promotions.', tags: ['solidarity', 'merit'], scene: 30 },
          { text: 'Trust across racial lines is earned through demonstrated competence, not granted through goodwill.', tags: ['merit', 'alliance'], scene: 20 },
          { text: 'Self-respect is itself a form of resistance.', tags: ['dignity', 'sexism'], scene: 4 },
          { text: 'A single moment of eloquence can move the people who hold power.', tags: ['courage', 'dignity', 'racism'], scene: 15 },
          { text: 'Technology can either entrench exclusion or break it open — the difference is who is prepared for it.', tags: ['technology', 'merit'], scene: 11 },
          { text: 'National crisis forces societies to confront the waste of discrimination.', tags: ['coldwar', 'merit'], scene: 8 },
          { text: 'Information control is a subtle but powerful tool of oppression.', tags: ['injustice', 'racism'], scene: 14 },
          { text: 'Endurance has a measurable cost: the film quantifies the tax of segregation.', tags: ['racism', 'injustice', 'perseverance'], scene: 10 },
          { text: 'Acceptance, when it finally comes, is expressed through small everyday gestures.', tags: ['solidarity', 'merit', 'dignity'], scene: 22 },
          { text: 'Foundational knowledge never stops paying off — old mathematics can solve brand-new problems.', tags: ['education', 'merit'], scene: 28 },
        ];
        const TURNING_POINTS = [
          { text: 'silent endurance finally erupts into open resistance', scene: 15 },
          { text: 'the institution physically tears down one of its own symbols of segregation', scene: 16 },
          { text: 'a life is entrusted to Katherine’s calculations because accuracy matters more than prejudice', scene: 20 },
          { text: 'mathematical authority is established in front of the military brass', scene: 19 },

        /* ================= FLASHCARDS ================= */
        function flashPool() {

          flash.deck = deck;

          flash.order = (doShuffle ? shuffle(pool) : pool).map((s) => s.id);
          flash.idx = 0; flash.flipped = false; flash.session = []; flash.done = false; flash.focus = null;

        function vFlashcards(root) {

            flash.focus = null; flash.flipped = false; flash.done = false;
          }
          const scene = sceneById(flash.order[flash.idx]);
          const due = dueCount();
          const confident = getScenes().filter((s) => masteryOf(s.id) === 'confident').length;
          const learning = getScenes().filter((s) => masteryOf(s.id) === 'learning').length;
          const saved = scene ? state.bookmarks.includes(scene.id) : false;
          const charOpts = getCharacters();
          root.innerHTML = `

              <div class="toolbar-actions">

                  <option value="saved" ${flash.deck === 'saved' ? 'selected' : ''}>Bookmarked (${state.bookmarks.length})</option>
                  ${charOpts.length ? `<optgroup label="Characters">${charOpts.map((c) => `<option value="${esc(c)}" ${flash.deck === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</optgroup>` : ''}
                  ${getTagUniverse().length ? `<optgroup label="Essay tags">${getTagUniverse().map((t) => `<option value="tag:${t}" ${flash.deck === 'tag:' + t ? 'selected' : ''}>${esc(tagLabel(t))}</option>`).join('')}</optgroup>` : ''}
                </select>${icon('sliders', 14)}</span>

            </div>
            ${scene ? `
            <div class="study-layout">

                <div class="card-progress"><span class="card-count">${pad2(flash.idx + 1)} / ${pad2(flash.order.length)}</span><div class="match-progress"><i style="width:${Math.round(((flash.idx + 1) / flash.order.length) * 100)}%"></i></div></div>
                ${flash.done ? `

                  <span class="eyebrow">SESSION COMPLETE</span>

              <aside class="flash-aside" aria-label="Study progress">

            <div class="empty-note">${flash.deck === 'due' ? 'Nothing is due right now. Beautiful. Take a quiz to keep sharp, or come back later.' : flash.deck === 'saved' ? 'No bookmarks yet. Tap the bookmark on a flashcard or in the library to build your shortlist.' : flash.deck.startsWith('tag:') ? `No scenes carry the ${esc(tagLabel(flash.deck.slice(4)))} tag in this sheet.` : 'This deck is empty.'}</div>`}`;
        }
        function flashRate(rating) {
          const id = flash.order[flash.idx];
          if (id == null || flash.done) return;
          rateCard(id, rating);
          if (!flash.session.includes(id)) flash.session.push(id);
          flash.flipped = false;
          if (flash.idx >= flash.order.length - 1) flash.done = true;
          else flash.idx++;
          renderNav(); renderView();
        }
        function flashNav(delta) {
          const n = flash.idx + delta;
          if (n < 0 || n >= flash.order.length) return;
          flash.idx = n; flash.flipped = false; flash.done = false;
          renderView();
        }

        /* ================= MATCHING ================= */
        function newMatchRound() {
          const scenes = getScenes();
          if (scenes.length < 5) { match.left = []; match.right = []; return; }
          let pool = shuffle(scenes);
          if (match.category === 'tag') {
            const seen = new Set();
            pool = pool.filter((s) => { const t = tagsOf(s)[0]; if (!t || seen.has(t)) return false; seen.add(t); return true; });
            if (pool.length < 5) { match.left = []; match.right = []; return; }
          }
          match.left = pool.slice(0, 5);
          match.right = shuffle(match.left);
          match.selL = null; match.selR = null; match.pairs = []; match.attempts = 0; match.wrong = false; match.done = false;
        }
        function rightLabel(s) { return match.category === 'technique' ? s.techniqueLabel : match.category === 'tag' ? tagLabel(tagsOf(s)[0] || 'merit') : s.meaningLabel; }
        function vMatching(root) {
          const scenes = getScenes();
          const enough = scenes.length >= 5 && !(match.category === 'tag' && !match.left.length);
          root.innerHTML = `
            <div class="section-toolbar">
              <div><h2>Match &amp; mix</h2><p class="section-sub">Connect a scene to the way it tells its story.</p></div>
              <span class="select-wrap"><select aria-label="Matching category" data-change="matchCategory">
                <option value="technique" ${match.category === 'technique' ? 'selected' : ''}>Scene + film technique</option>
                <option value="meaning" ${match.category === 'meaning' ? 'selected' : ''}>Scene + big idea</option>
                <option value="tag" ${match.category === 'tag' ? 'selected' : ''}>Scene + essay tag</option>
              </select>${icon('sliders', 14)}</span>
            </div>
            ${enough ? `
            <div class="activity-instructions">${icon('link', 18)}<p>Choose one item from each column. A correct pair stays connected.</p><span>${match.pairs.length} / 5 pairs</span></div>
            <div class="match-progress"><i style="width:${match.pairs.length * 20}%"></i></div>
            <div class="matching-grid">
              <div>
                <div class="column-label"><span>THE SCENE</span><span>5 MOMENTS</span></div>
                <div class="match-list">
                  ${match.left.map((s) => `
                    <button class="match-item ${match.selL === s.id ? 'selected' : ''} ${match.pairs.includes(s.id) ? 'matched' : ''} ${match.wrong && match.selL === s.id ? 'wrong' : ''}"
                      data-action="pickLeft" data-id="${s.id}" aria-pressed="${match.selL === s.id}" ${match.pairs.includes(s.id) || match.wrong ? 'disabled' : ''}>
                      <span class="match-number">${pad2(s.id)}</span><strong>${esc(s.title)}</strong>
                      <span class="match-check">${match.pairs.includes(s.id) ? icon('check', 17) : ''}</span>
                    </button>`).join('')}
                </div>
              </div>
              <div class="matching-link" aria-hidden="true">${icon('link', 22)}</div>
              <div>
                <div class="column-label"><span>${match.category === 'technique' ? 'THE TECHNIQUE' : match.category === 'tag' ? 'THE ESSAY TAG' : 'THE BIG IDEA'}</span><span>5 CONNECTIONS</span></div>
                <div class="match-list">
                  ${match.right.map((s) => `
                    <button class="match-item right-item ${match.selR === s.id ? 'selected' : ''} ${match.pairs.includes(s.id) ? 'matched' : ''} ${match.wrong && match.selR === s.id ? 'wrong' : ''}"
                      data-action="pickRight" data-id="${s.id}" aria-pressed="${match.selR === s.id}"
                      aria-label="${match.category === 'technique' ? 'Technique' : match.category === 'tag' ? 'Essay tag' : 'Idea'}: ${esc(rightLabel(s))}"
                      ${match.pairs.includes(s.id) || match.wrong ? 'disabled' : ''}>
                      <strong>${esc(rightLabel(s))}</strong>
                      <span class="match-check">${match.pairs.includes(s.id) ? icon('check', 17) : ''}</span>
                    </button>`).join('')}
                </div>
              </div>
            </div>
            <div class="match-bottom" aria-live="polite">
              ${match.done ? `
                <div class="match-success">${icon('checkCircle', 26)}<div><h3>Everything clicked.</h3><p>5 pairs in ${plural(match.attempts, 'attempt')}. Ready for a fresh mix?</p></div>
                <button class="button yellow" style="margin-left:auto" data-action="newMatch">${icon('shuffle', 16)} New round</button></div>`
              : match.wrong ? `<p class="error-text">Not quite. Think about the ${match.category === 'technique' ? 'technique' : match.category === 'tag' ? 'essay tag' : 'idea'}, then try again.</p>`
              : match.selL || match.selR ? `<p>Now pick the ${match.selL ? (match.category === 'technique' ? 'technique' : match.category === 'tag' ? 'essay tag' : 'idea') : 'scene'} that connects.</p>`
              : `<p>Pick any scene to start matching.</p>`}
            </div>
            <div class="technique-footer">${icon('bulb', 18)}<div><strong>Concrete examples</strong><p>Matching forces you to tell similar moments apart — the exact skill an essay question rewards.</p></div></div>`
            : `<div class="empty-note">${scenes.length < 5 ? `Match &amp; mix needs at least 5 scenes, and this sheet has ${scenes.length}. Add more scenes to your sheet and come back.` : match.category === 'tag' ? 'The essay-tag round needs 5 scenes with five different primary tags — this sheet has fewer. Try another category.' : 'This round cannot start.'}</div>`}`;
        }
        function matchPick(side, id) {
          if (match.wrong || match.done || match.pairs.includes(id)) return;
          if (side === 'L') { match.selL = match.selL === id ? null : id; }
          else { match.selR = match.selR === id ? null : id; }
          if (match.selL != null && match.selR != null) {
            match.attempts++;
            if (match.selL === match.selR) {
              match.pairs.push(match.selL);
              match.selL = null; match.selR = null;
              if (match.pairs.length === 5) { match.done = true; state.activity.matches++; save(); markStudied(); }
            } else {
              match.wrong = true;
              setTimeout(() => { match.wrong = false; match.selL = null; match.selR = null; renderView(); }, 650);
            }
          }
          renderView();
        }

        /* ================= QUIZ — essay-focused question engine ================= */
        const BARRIERS = [
          { tag: 'racism', text: 'Racism built into rules and spaces' },
          { tag: 'sexism', text: 'Assumptions about what women can do' },
          { tag: 'injustice', text: 'Bureaucratic gatekeeping and red tape' },
          { tag: 'technology', text: 'The disruption of new technology' },
          { tag: 'coldwar', text: 'Geopolitical pressure of the space race' },
        ];
        const sceneText = (s) => `${pad2(s.id)} — ${s.title}`;
        function distractorPool(n, excludeIds, prefer) {
          const scenes = getScenes();
          let pool = scenes.filter((s) => !excludeIds.includes(s.id) && (!prefer || prefer(s)));
          if (pool.length < n && prefer) pool = scenes.filter((s) => !excludeIds.includes(s.id));
          return shuffle(pool).slice(0, n);
        }
        function optionSet(textFn, pairs) {
          // pairs: [{ id, scene }] or [{ id, text }] -> options with unique text; null if fewer than 3 unique texts
          const items = pairs.map((p) => ({ id: p.id, text: p.text != null ? p.text : textFn(p.scene) }));
          const seen = new Set();
          for (const it of items) { if (seen.has(it.text)) return null; seen.add(it.text); }
          return items;
        }
        function buildBank() {
          const scenes = getScenes();
          const bank = [];
          const push = (q) => { if (q && q.options && q.options.length >= 3) bank.push(q); };
          const sceneQ = (scene, ds, textFn) => optionSet(textFn || sceneText, [{ id: scene.id, scene }, ...ds.map((s) => ({ id: s.id, scene: s }))]);

          /* 1 · ARGUMENT → EVIDENCE — match a thesis to its strongest scene */
          THESES.forEach((th) => {
            const scene = sceneById(th.scene); if (!scene) return;
            const ds = distractorPool(3, [scene.id], (s) => !tagsOf(s).includes(th.tags[0]));
            const opts = sceneQ(scene, ds); if (!opts) return;
            push({ kind: 'thesis', kindLabel: 'ARGUMENT → EVIDENCE', tag: th.tags[0], scene,
              prompt: 'Which scene is your strongest evidence for this essay argument?',
              clue: `“${th.text}”`, options: shuffle(opts), answer: scene.id,
              explanation: `${scene.fullTitle} — ${scene.essay} That is why it anchors an argument about ${th.tags.map((t) => tagLabel(t).toLowerCase()).join(' and ')}.` });
          });

          /* 2 · THEME EVIDENCE — one question per (scene, tag) pair */
          scenes.forEach((scene) => {
            tagsOf(scene).forEach((tag) => {
              const ds = distractorPool(3, [scene.id], (s) => !tagsOf(s).includes(tag));
              const opts = sceneQ(scene, ds); if (!opts) return;
              push({ kind: 'theme', kindLabel: 'THEME EVIDENCE', tag, scene,
                prompt: `Which of these scenes develops the idea of ${tagLabel(tag).toLowerCase()}?`,
                clue: `${tagLabel(tag)} — ${tagDef(tag)}.`, options: shuffle(opts), answer: scene.id,
                explanation: `Scene ${pad2(scene.id)}, “${scene.title}”, carries this idea: ${scene.essay}` });
            });
          });

          /* 3 · TECHNIQUE → EFFECT — link film language to meaning */
          scenes.forEach((scene) => {
            const ds = distractorPool(3, [scene.id], (s) => !tagsOf(s).some((t) => tagsOf(scene).includes(t)));
            const opts = sceneQ(scene, ds, (s) => s.meaningLabel); if (!opts) return;
            push({ kind: 'tech', kindLabel: 'TECHNIQUE → EFFECT', tag: tagsOf(scene)[0] || null, scene,
              prompt: `In “${scene.title}”, the filmmakers rely on ${lower1(scene.techniqueLabel)}. What is the main effect of that choice?`,
              clue: 'Pick the meaning the technique creates — not just what happens.',
              options: shuffle(opts), answer: scene.id,
              explanation: `${scene.techniques} This is what the technique achieves: ${scene.meaningLabel}. ${scene.essay}` });
          });

          /* 4 · TOPIC SENTENCE — state the argument of a paragraph */
          scenes.forEach((scene) => {
            const ds = distractorPool(3, [scene.id], (s) => !tagsOf(s).some((t) => tagsOf(scene).includes(t)));
            const opts = sceneQ(scene, ds, (s) => s.meaningLabel); if (!opts) return;
            push({ kind: 'topic', kindLabel: 'TOPIC SENTENCE', tag: tagsOf(scene)[0] || null, scene,
              prompt: `Which topic sentence opens the strongest analytical paragraph on “${scene.title}”?`,
              clue: scene.cueText || scene.description.slice(0, 140),
              options: shuffle(opts), answer: scene.id,
              explanation: `A topic sentence states the argument up front: “${scene.meaningLabel}.” ${scene.essay}` });
          });

          /* 5 · BARRIER ANALYSIS — name the force the scene dramatises */
          scenes.forEach((scene) => {
            const st = tagsOf(scene);
            const hit = BARRIERS.find((b) => st.includes(b.tag)); if (!hit) return;
            const ds = BARRIERS.filter((b) => b !== hit && !st.includes(b.tag)).slice(0, 3);
            if (ds.length < 2) return;
            push({ kind: 'barrier', kindLabel: 'BARRIER ANALYSIS', tag: hit.tag, scene,
              prompt: `What kind of barrier does “${scene.title}” put on screen?`,
              clue: 'Name the force the scene is really about.',
              options: shuffle([{ id: scene.id, text: hit.text }, ...ds.map((b, i) => ({ id: -(i + 1), text: b.text }))]),
              answer: scene.id,
              explanation: `${scene.essay} The barrier dramatised here is ${lower1(hit.text)}.` });
          });

          /* 6 · ANALYSIS OR SUMMARY — the skill markers actually grade */
          scenes.forEach((scene) => {
            const first = (scene.description.match(/^[^.]+\./) || [scene.description])[0].trim();
            const correct = `${scene.meaningLabel} — achieved through ${lower1(scene.techniqueLabel)}.`;
            const opts = optionSet((p) => p.text, [
              { id: scene.id, text: correct },
              { id: -11, text: first },
              { id: -12, text: `${scene.character} appears in this scene, which is part of the ${getSheet().name} storyline.` },
              { id: -13, text: 'This scene is very powerful and emotional, which makes it important.' },
            ]); if (!opts) return;
            push({ kind: 'analysis', kindLabel: 'ANALYSIS OR SUMMARY?', tag: tagsOf(scene)[0] || null, scene,
              prompt: `You are writing a paragraph on “${scene.title}”. Which sentence is real analysis?`,
              clue: 'Analysis names a technique and its effect. Everything else is filler.',
              options: shuffle(opts), answer: scene.id,
              explanation: `The analytical sentence names the technique (${lower1(scene.techniqueLabel)}) and states its effect (${lower1(scene.meaningLabel)}). The others only summarise the plot, repeat a fact, or share an opinion.` });
          });

          /* 7 · BUILDING A PARAGRAPH — find a second, supporting example */
          scenes.forEach((scene) => {
            tagsOf(scene).forEach((tag) => {
              const partners = scenes.filter((s) => s.id !== scene.id && tagsOf(s).includes(tag));
              if (!partners.length) return;
              const partner = shuffle(partners)[0];
              const ds = distractorPool(3, [scene.id, partner.id], (s) => !tagsOf(s).includes(tag));
              const opts = sceneQ(partner, ds); if (!opts) return;
              push({ kind: 'pair', kindLabel: 'BUILDING A PARAGRAPH', tag, scene: partner,
                prompt: `Your paragraph on ${tagLabel(tag).toLowerCase()} uses “${scene.title}”. Which scene adds a second example?`,

            const p = payload && payload.progress ? payload.progress : (payload && payload.cards ? payload : null);
            if (!p || typeof p !== 'object' || !p.cards) { toast('No progress found in that file — restore cancelled.', 'alert'); return; }
            const cardsN = Object.keys(p.cards || {}).length;
            const marksN = (p.bookmarks || []).length;
            const notesN = Object.keys(p.notes || {}).length;
            const streakN = (p.activity && Number.isFinite(p.activity.streak)) ? p.activity.streak : 0;
            const when = payload.exportedAt ? new Date(payload.exportedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) : 'an unknown date';
            pendingRestore = { cards: p.cards || {}, bookmarks: Array.isArray(p.bookmarks) ? p.bookmarks : [], notes: p.notes || {}, activity: Object.assign({ matches: 0, quizzes: 0, lastScore: null, explanations: [], streak: 0, lastStudyDay: null }, p.activity || {}) };
            openModal(`
              <div class="modal-head"><h2>Restore this backup?</h2><button class="icon-button" data-action="closeModal" aria-label="Close dialog">${icon('x', 20)}</button></div>
              <div class="modal-body">

          };

          reader.readAsText(file);

            if (kind === 'quizLen') { quiz.len = el.value === 'all' ? 'all' : Number(el.value); }
            if (kind === 'quizFocus') { quiz.focus = el.value; }
            if (kind === 'recallScene') { recall.sceneId = Number(el.value); recall.checked = false; renderView(); }
          }
          if (e.target.id === 'sheetFile' && e.target.files && e.target.files[0]) {
            const f = e.target.files[0];
            e.target.value = '';
            handleSheetFile(f);
          }
          if (e.target.id === 'progressFile' && e.target.files && e.target.files[0]) {
            const f = e.target.files[0];
            e.target.value = '';
            previewProgressRestore(f);
          }
        });

        document.addEventListener('input', (e) => {
          if (e.target.dataset.input === 'librarySearch') {
            library.q = e.target.value;
            const grid = $('.library-grid', viewEl);
            const countEl = $('.library-count', viewEl);
            const scenes = filteredScenes();
            if (countEl) countEl.textContent = scenes.length === getScenes().length ? `Showing all ${plural(scenes.length, 'scene')}.` : `Showing ${scenes.length} of ${plural(getScenes().length, 'scene')}.`;
            if (grid) {
              grid.innerHTML = scenes.length ? scenes.map((s) => {
                const saved = state.bookmarks.includes(s.id);
                return `<button class="scene-tile" data-action="openScene" data-id="${s.id}" aria-label="Open details for ${esc(s.title)}">
                  <span class="tile-top"><span class="tile-num">${masteryRing(s.id)}${pad2(s.id)}</span>
                  <span class="icon-button tile-save ${saved ? 'saved' : ''}" data-action="toggleBookmarkStop" data-id="${s.id}" role="button" aria-label="${saved ? 'Remove bookmark' : 'Bookmark scene'}" tabindex="0">${icon('bookmark', 17)}</span></span>
                  ${cueArt(s.cue, s.cueText, 'art')}
                  <h3>${esc(s.title)}</h3>
                  <span class="tile-char">${esc(s.character)}</span>
                  ${s.analysisType ? `<span class="tile-analysis">${esc(s.analysisType)}</span>` : ''}
                  ${tagsOf(s).length ? `<span class="tile-tags">${tagsOf(s).slice(0, 3).map((t) => `<i style="color:${tagColor(t)}">#${esc(t)}</i>`).join(' ')}${tagsOf(s).length > 3 ? ` <b>+${tagsOf(s).length - 3}</b>` : ''}</span>` : ''}
                  <span class="tile-cue print-only">${esc(s.cueText)}</span>
                </button>`;
              }).join('') : `<div class="empty-note" style="grid-column:1/-1">No scenes match. Try a different search or filter.</div>`;
            }
          }
          if (e.target.id === 'recallAnswer') {
            const text = e.target.value;
            state.notes[recall.sceneId] = text; save();
            const wc = e.target.closest('.writing-area').querySelector('.writing-meta span');
            if (wc) wc.textContent = `${text.trim() ? text.trim().split(/\s+/).length : 0} words`;
            const btn = $('.writing-actions .button.primary', viewEl);
            if (btn) btn.disabled = !text.trim();
          }
        });

        // Dropzone events
        document.addEventListener('dragover', (e) => {
          const dz = e.target.closest && e.target.closest('#dropzone');
          if (dz) { e.preventDefault(); dz.classList.add('dragover'); }
        });
        document.addEventListener('dragleave', (e) => {
          const dz = e.target.closest && e.target.closest('#dropzone');
          if (dz) dz.classList.remove('dragover');
        });
        document.addEventListener('drop', (e) => {
          const dz = e.target.closest && e.target.closest('#dropzone');
          if (dz) {
            e.preventDefault();
            dz.classList.remove('dragover');
            const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (f) handleSheetFile(f);
          }
        });
        // Keyboard activation for dropzone
        document.addEventListener('keydown', (e) => {
          if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'dropzone') { e.preventDefault(); $('#sheetFile').click(); }
        });

        // Flashcard keyboard shortcuts
        document.addEventListener('keydown', (e) => {
          if (currentView !== 'flashcards') return;
          if (e.target.closest('input, textarea, select') || modalRoot.childElementCount) return;
          if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); flash.flipped = !flash.flipped; renderView(); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); flashNav(-1); }
          else if (e.key === 'ArrowRight') { e.preventDefault(); flashNav(1); }
          else if (e.key === '1' && flash.flipped) { e.preventDefault(); flashRate('again'); }
          else if (e.key === '2' && flash.flipped) { e.preventDefault(); flashRate('good'); }
          else if (e.key === '3' && flash.flipped) { e.preventDefault(); flashRate('easy'); }
        });

        // Quiz keyboard shortcuts: 1-4 pick, Enter/ArrowRight next
        document.addEventListener('keydown', (e) => {
          if (currentView !== 'quiz' || !quiz.qs.length || quiz.done) return;
          if (e.target.closest('input, textarea, select') || modalRoot.childElementCount) return;
          const q = quiz.qs[quiz.idx];
          if (!q) return;
          if (['1', '2', '3', '4'].includes(e.key)) {
            const i = Number(e.key) - 1;
            if (q.options[i] && quiz.picked == null) { e.preventDefault(); quizPick(q.options[i].id); }
          } else if ((e.key === 'Enter' || e.key === 'ArrowRight') && quiz.picked != null) {
            e.preventDefault(); quizNext();
          }
        });

        // "/" jumps to the library search
        document.addEventListener('keydown', (e) => {
          if (currentView !== 'library' || e.key !== '/') return;
          if (e.target.closest('input, textarea, select') || modalRoot.childElementCount) return;
          e.preventDefault();
          const inp = $('#librarySearch');
          if (inp) { inp.focus(); inp.select(); }
        });

        // Escape closes modal; mobile nav toggle
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalRoot.childElementCount) closeModal(); });
        // "?" opens the keyboard shortcut cheat sheet
        document.addEventListener('keydown', (e) => {
          if (e.key !== '?') return;
          if (e.target.closest('input, textarea, select') || modalRoot.childElementCount) return;
          e.preventDefault();
          openShortcuts();
        });
        $('#menuBtn').innerHTML = icon('menu', 22);
        $('#kbdHelpBtn').innerHTML = icon('keyboard', 18);
        $('#menuBtn').addEventListener('click', () => {
          const open = document.body.classList.toggle('nav-open');
          $('#menuBtn').setAttribute('aria-expanded', String(open));
        });
        $('#sidebarOverlay').addEventListener('click', () => document.body.classList.remove('nav-open'));

        /* ================= THEME ================= */
        const THEME_KEY = 'scenestudy-theme';
        const isDark = () => document.documentElement.dataset.theme === 'dark';
        function updateThemeBtns() {
          const dark = isDark();
          const label = dark ? 'Light mode' : 'Dark mode';
          document.querySelectorAll('[data-action="theme"]').forEach((b) => {
            b.innerHTML = `${icon(dark ? 'sun' : 'moon', 18)}<span>${label}</span>`;
            b.setAttribute('aria-label', `Switch to ${label.toLowerCase()}`);
            b.title = `Switch to ${label.toLowerCase()}`;
          });
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#15170f' : '#fcfcf9');
        }

        function exportNotesMarkdown() {
          const sheet = getSheet();
          const L = [];
          L.push(`# ${sheet.name} — study notes`, '');
          L.push(`_Generated by SceneStudy on ${new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })}_`, '');
          if (sheet.description) L.push(sheet.description, '');
          getScenes().forEach((s) => {
            const m = masteryOf(s.id);
            L.push(`## ${pad2(s.id)} — ${s.title}`, '');
            const meta = [];
            if (s.character) meta.push(`**Character:** ${s.character}`);
            if (s.analysisType) meta.push(`**Essay type:** ${s.analysisType}`);
            const tg = tagsOf(s);
            if (tg.length) meta.push(`**Essay tags:** ${tg.map((t) => `#${t}`).join(', ')}`);
            if (s.themes && s.themes.length) meta.push(`**Themes:** ${s.themes.join(', ')}`);
            if (meta.length) L.push(meta.join('  \n'), '');
            if (s.description) L.push(`**What happens.** ${s.description}`, '');
            if (s.techniques || s.techniqueLabel) L.push(`**How it's filmed.** ${s.techniqueLabel ? `_${s.techniqueLabel}_ — ` : ''}${s.techniques || ''}`, '');
            if (s.essay || s.meaningLabel) L.push(`**Why it matters.** ${s.meaningLabel ? `_${s.meaningLabel}_ — ` : ''}${s.essay || ''}`, '');
            if (s.cueText) L.push(`> Visual cue: ${s.cueText}`, '');
            const note = state.notes[s.id];
            if (note && note.trim()) L.push(`**My notes.** ${note.trim()}`, '');
            L.push(`**Mastery:** ${m === 'confident' ? 'Confident' : m === 'learning' ? 'Learning' : 'Not studied'}${state.bookmarks.includes(s.id) ? ' · bookmarked' : ''}`, '', '---', '');
          });
          const fname = (sheet.name || 'scene-sheet').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          downloadFile(L.join('\n'), `${fname}-study-notes.md`, 'text/markdown');
          toast('Study notes downloaded as Markdown — ready for Notion or Docs.', 'notes');
        }

        function printPack() {
          toast('Opening print dialog — choose “Save as PDF” for a paper study pack.', 'printer');
          setTimeout(() => window.print(), 400);
        }

        /* ================= INIT ================= */
        $('#brandMark').innerHTML = BRAND_MARK;
        $('#mobileBrandMark').innerHTML = BRAND_MARK;
        $('#footMark').innerHTML = BRAND_MARK;
        updateThemeBtns();
        resetViewStates();
        renderNav();
        renderView();
      })();
    </script>
  </body>
</html>
